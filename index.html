<style>

    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: #252a3e;
    --red-danger: #dc2626;
    --gold: #fbbf24;
  }

  body.theme-rdr2 {
    --bg-main: #120c09;
    --bg-card: #1c130e;
    --bg-card-hover: #291a13;
    --bg-panel: #18100b;
    --primary: #c2410c;
    --primary-hover: #9a3412;
    --pink-neon: #f59e0b;
    --border: #431407;
    --text-main: #fef3c7;
    --text-muted: #d97706;
  }

  body.theme-cyberpunk {
    --bg-main: #05050a;
    --bg-card: #0d0d1a;
    --bg-card-hover: #16162e;
    --bg-panel: #0a0a14;
    --primary: #06b6d4;
    --primary-hover: #0891b2;
    --pink-neon: #f43f5e;
    --border: #1e1b4b;
    --text-main: #ecfeff;
    --text-muted: #22d3ee;
  }

  body.light {
    --bg-main: #f1f5f9; --bg-card: #ffffff; --bg-card-hover: #f8fafc;
    --bg-panel: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
  }

  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden !important;
    position: relative;
    scroll-behavior: smooth;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; }
  body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; outline: none; background: none; font-family: inherit; }

  .app-container { display: flex; flex-direction: column; min-height: 100vh; width: 100%; overflow-x: hidden; }
  header.top-bar {
    height: 70px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 40;
    width: 100%;
  }

  .brand-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-logo .logo-icon {
    width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--pink-neon));
    border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;
  }
  .brand-logo h1 { font-size: 22px; font-weight: 900; color: white; }

  .header-left { display: flex; align-items: center; gap: 8px; }
  .search-box { position: relative; width: 180px; }
  .search-box input {
    width: 100%; padding: 8px 36px 8px 12px; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); font-size: 12px;
  }
  .search-box input:focus { border-color: var(--primary); outline: none; }
  .search-box .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }

  .main-wrapper { display: flex; flex: 1; position: relative; width: 100%; }
  .nav-rail {
    width: 70px; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 18px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 18px; transition: all 0.2s;
  }
  .rail-btn:hover, .rail-btn.active { background: var(--primary); color: white; }

  .content-area { flex: 1; padding: 28px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 20px; font-weight: 800; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .btn-finder {
    background: linear-gradient(135deg, var(--pink-neon), var(--primary));
    color: white; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(217, 70, 239, 0.35); transition: 0.2s;
  }

  .btn-mobile-sec {
    background: rgba(217, 70, 239, 0.15); border: 1px solid var(--pink-neon);
    color: var(--pink-neon); padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; gap: 6px; transition: 0.2s;
  }
  .btn-mobile-sec.active, .btn-mobile-sec:hover { background: var(--pink-neon); color: white; }

  .btn-add-game {
    background: var(--primary); color: white; padding: 9px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }

  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-bottom: 35px; width: 100%; }
  .game-card-modern {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    transition: transform 0.2s, border-color 0.2s; cursor: pointer; display: flex; flex-direction: column; position: relative; width: 100%;
  }
  .game-card-modern:hover { transform: translateY(-5px); border-color: var(--primary); }

  .card-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .card-title-text { font-size: 15px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; direction: ltr; }

  .admin-delete-btn {
    position: absolute; top: 8px; right: 8px; background: var(--red-danger); color: white;

  .news-date { font-size: 10px; color: var(--text-muted); }

    background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(217, 70, 239, 0.15));
    border: 1px solid var(--primary); border-radius: 16px; padding: 18px; margin: 25px 0; text-align: center; width: 100%;

    width: 100%; padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border);

    display: flex; justify-content: space-between; align-items: center;

  .promo-banner {
    background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%); border: 2px solid var(--pink-neon); border-radius: 20px;
    padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; margin: 30px 0; width: 100%;

  .page-btn { width: 34px; height: 34px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; }
  .modal-close {
    position: absolute; top: 12px; left: 12px; width: 36px; height: 36px;
    border-radius: 50%; background: rgba(255,255,255,0.15); color: white;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;

  .modal-close:hover { background: var(--red-danger); }

  .btn-modal-back {
    width: 100%; padding: 12px; margin-top: 20px; background: var(--bg-card-hover); border: 1px solid var(--border);

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 12px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: 700; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

  .btn-download-iran {
    background: linear-gradient(135deg, var(--emerald-green), var(--emerald-hover));
    color: white; padding: 14px 20px; border-radius: 12px; font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 15px;
  }

  .sys-req-box { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 15px; text-align: right; }
  .sys-req-title { font-size: 12px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }

  .form-gallery, .detail-gallery { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .form-gallery img, .detail-gallery img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
  .detail-gallery img:hover, .detail-gallery img.active { border-color: var(--pink-neon); transform: scale(1.1); }
  .form-gallery div { position: relative; }
  .form-gallery button { position: absolute; top: -5px; right: -5px; background: var(--red-danger); color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; }

  .rating-stars { display: flex; gap: 6px; justify-content: center; margin: 12px 0; direction: ltr; }
  .star-btn { font-size: 24px; color: #4b5563; transition: 0.2s; cursor: pointer; }
  .star-btn.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

  .comment-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; text-align: right; }
  .comment-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 6px; }
  .comment-author { color: var(--pink-neon); font-weight: bold; }

  .mobile-nav { display: none; }

  @media (max-width: 768px) {
    header.top-bar { padding: 0 10px; height: 60px; }
    .brand-logo h1 { font-size: 15px; }
    .search-box { width: 110px; }
    .search-box input { padding: 6px 24px 6px 6px; font-size: 10px; }
    .btn-finder, .btn-mobile-sec { display: none; }
    
    .nav-rail { display: none; }
    .filter-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 80%; max-width: 280px; }
    .content-area { padding: 16px 10px; width: 100%; }
    .games-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; width: 100% !important; }
    .promo-banner { flex-direction: column; text-align: center; gap: 10px; padding: 16px 12px; }

    .mobile-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      background: var(--bg-panel); border-top: 1px solid var(--border); height: 55px; justify-content: space-around; align-items: center; z-index: 50;
    }
    .mobile-nav button { font-size: 16px; display: flex; flex-direction: column; align-items: center; color: var(--text-muted); }
    .mobile-nav button span { font-size: 9px; margin-top: 2px; }
    .mobile-nav button.active { color: var(--pink-neon); }
 
}

<script>
(function(){
"use strict";
/* ===== تنظیمات ابر (اختیاری — برای سینک خودکار بین همه بازدیدکننده‌ها) ===== */
var GSF_BIN   = "";
var GSF_KEY   = "";
var GSF_ADMIN = "";
/* ========================================================================== */
var origSet = Storage.prototype.setItem;
var origGet = Storage.prototype.getItem;
var origRem = Storage.prototype.removeItem;
var gamesKey = null;
var syncTimer = null;

function $(id){ return document.getElementById(id); }

function toast(msg, isErr){
  var w = document.querySelector(".gsf-toast-wrap");
  if(!w){ w = document.createElement("div"); w.className = "gsf-toast-wrap"; document.body.appendChild(w); }
  var t = document.createElement("div");
  t.className = "gsf-toast" + (isErr ? " err" : "");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){ t.style.opacity = "0"; t.style.transition = "opacity .4s"; }, 4200);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 4700);
}

/* ---------- پاک‌سازی عکس‌های base64 که حافظه را پر کرده‌اند ---------- */
function stripBase64(str){
  return String(str).replace(/data:image\/[a-zA-Z0-9+.-]+;base64,[A-Za-z0-9+/=]+/g, "");
}
function deepClean(v){
  if(typeof v === "string") return stripBase64(v);
  if(Array.isArray(v)) return v.map(deepClean);
  if(v && typeof v === "object"){
    var o = {};
    for(var k in v) o[k] = deepClean(v[k]);
    return o;
  }
  return v;
}
function freeSpace(){
  var changed = 0;
  for(var i = 0; i < localStorage.length; i++){
    var k = localStorage.key(i);
    var v = origGet.call(localStorage, k);
    if(v && v.indexOf("data:image") !== -1){
      try{ origSet.call(localStorage, k, JSON.stringify(deepClean(JSON.parse(v)))); }
      catch(e){ try{ origSet.call(localStorage, k, stripBase64(v)); }catch(e2){} }
      changed++;
    }
  }
  return changed;
}

/* ---------- نگهبان ذخیره‌سازی: دیگر دکمه ذخیره هرگز بی‌صدا نمی‌میرد ---------- */
Storage.prototype.setItem = function(k, v){
  try{
    origSet.call(this, k, v);
  }catch(e){
    freeSpace();
    try{
      origSet.call(this, k, v);
      toast("ذخیره انجام شد! حافظه مرورگر آزاد شد (عکس‌های فایلی قدیمی برداشته شدند). از این به بعد عکس را با «لینک» وارد کن تا حجم نگیرد و همه ببینند.", false);
    }catch(e2){
      toast("حافظه مرورگر کاملاً پر است و ذخیره انجام نشد. عکس‌ها را حتماً با لینک وارد کن؛ عکس فایلی فقط روی سیستم خودت باقی می‌ماند.", true);
    }
  }
  maybeSync(k);
};

/* ---------- تشخیص خودکار کلید ذخیره‌ی بازی‌ها در localStorage ---------- */
function detectGamesKey(){
  var best = null, bestScore = 2;
  for(var i = 0; i < localStorage.length; i++){
    var k = localStorage.key(i);
    if(!k || k.indexOf("__gsf") === 0) continue;
    var raw = origGet.call(localStorage, k);
    if(!raw || raw.charAt(0) !== "[") continue;
    var arr;
    try{ arr = JSON.parse(raw); }catch(e){ continue; }
    if(!Array.isArray(arr) || !arr.length || typeof arr[0] !== "object" || arr[0] === null) continue;
    var keys = Object.keys(arr[0]).join(" ").toLowerCase();
    var vals = JSON.stringify(arr[0]).toLowerCase();
    var score = 0;
    if(/title|name|game/.test(keys)) score += 2;
    if(/img|image|photo|pic|cover|poster|avatar|src/.test(keys)) score += 2;
    if(/data:image|\.png|\.jpe?g|\.webp|http/.test(vals)) score += 2;
    if(arr.length > 1) score += 1;
    if(score > bestScore){ best = k; bestScore = score; }
  }
  return best;
}
function getGamesArr(){
  if(!gamesKey) gamesKey = detectGamesKey();
  if(!gamesKey) return null;
  try{
    var a = JSON.parse(origGet.call(localStorage, gamesKey) || "[]");
    return Array.isArray(a) ? a : null;
  }catch(e){ return null; }
}

/* ---------- سینک ابری (فقط وقتی Bin ID و Key وارد شده باشد) ---------- */
var cloudOn = GSF_BIN.length > 5 && GSF_KEY.length > 5;
function dedupe(list){
  var seen = {}, out = [];
  list.forEach(function(it){
    if(!it || typeof it !== "object") return;
    var k = it.id != null ? "id" + it.id : "t" + String(it.title || it.name || JSON.stringify(it).slice(0,40));
    if(!seen[k]){ seen[k] = 1; out.push(it); }
  });
  return out;
}
function cloudPull(){
  if(!cloudOn) return;
  var arr = getGamesArr();
  if(!gamesKey) return;
  fetch("https://api.jsonbin.io/v3/b/" + GSF_BIN + "/latest", { headers: { "X-Master-Key": GSF_KEY } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var cloud = d && d.record && d.record.games;
      if(!Array.isArray(cloud)) return;
      var local = arr || [];
      var merged = dedupe(cloud.concat(local));
      if(JSON.stringify(merged) !== JSON.stringify(local)){
        origSet.call(localStorage, gamesKey, JSON.stringify(merged));
        if(!sessionStorage.getItem("__gsf_rl")){
          sessionStorage.setItem("__gsf_rl", "1");
          location.reload();
        }
      }
    })
    .catch(function(){});
}
function maybeSync(k){
  if(!cloudOn || !gamesKey || k !== gamesKey) return;
  if(GSF_ADMIN && origGet.call(localStorage, "__gsf_admin") !== GSF_ADMIN) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){
    var arr = getGamesArr() || [];
    fetch("https://api.jsonbin.io/v3/b/" + GSF_BIN, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": GSF_KEY },
      body: JSON.stringify({ games: arr })
    })
    .then(function(r){ if(r.ok) toast("سینک ابری انجام شد — این تغییرات حالا برای همه بازدیدکننده‌ها دیده می‌شود."); else toast("سینک ابری ناموفق بود. کلید JSONBin را چک کن.", true); })
    .catch(function(){ toast("اتصال به ابر برقرار نشد.", true); });
  }, 900);
}

/* ---------- ساخت کد انتشار برای گیت‌هاب (حالت بدون ابر) ---------- */
function normItem(it, idx){
  function pick(o, names){ for(var i=0;i<names.length;i++){ if(o[names[i]] != null) return o[names[i]]; } return undefined; }
  var img = pick(it, ["img","image","photo","picture","cover","poster","src","thumb","thumbnail"]);
  return {
    id: pick(it, ["id"]) != null ? pick(it, ["id"]) : idx + 1,
    title: String(pick(it, ["title","name","game","gameTitle","fa","en"]) || "بازی"),
    img: String(img || ""),
    rating: Number(pick(it, ["rating","rate","score","stars"]) || 0),
    year: String(pick(it, ["year","date","release","released"]) || "")
  };
}
function buildExport(){
  var arr = getGamesArr() || [];
  var lines = arr.map(function(it, i){
    var n = normItem(it, i);
    return '  { id: ' + n.id + ', title: "' + n.title.replace(/"/g, '\\"') + '", img: "' + n.img.replace(/"/g, "") + '", rating: ' + n.rating + ', year: "' + n.year + '" }';
  });
  return "// ====== GAMES DATA (شروع) ======\nconst GAMES = [\n" + lines.join(",\n") + "\n];\n// ====== GAMES DATA (پایان) ======";
}
function copyText(txt, done){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ legacyCopy(txt, done); });
  } else legacyCopy(txt, done);
}
function legacyCopy(txt, done){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); done();
}

/* ---------- مرکز انتشار (دکمه شناور) ---------- */
function openPanel(){
  if($("gsf-bg")) return;
  var bg = document.createElement("div"); bg.className = "gsf-mbg"; bg.id = "gsf-bg";

  m.innerHTML =

    '<div class="gsf-row"><b>کلید ذخیره‌ی بازی‌ها</b><span class="gsf-badge ' + (keyFound ? "on" : "off") + '">' + (keyFound ? keyFound + " (" + (arr ? arr.length : 0) + " بازی)" : "پیدا نشد — اول یه بازی اضافه کن") + '</span></div>' +
    '<div class="gsf-row"><b>سینک ابری خودکار</b><span class="gsf-badge ' + (cloudOn ? "on" : "off") + '">' + (cloudOn ? "فعال" : "غیرفعال — Bin ID وارد نشده") + '</span></div>' +
    '<div class="gsf-row"><b>وضعیت مدیر</b><span class="gsf-badge ' + (isAdmin || !GSF_ADMIN ? "on" : "") + '">' + (GSF_ADMIN ? (isAdmin ? "مدیر وارد شده" : "مهمان") : "بدون رمز") + '</span></div>' +
    (cloudOn && GSF_ADMIN && !isAdmin ? '<button class="gsf-btn ghost" id="gsf-login">ورود مدیر (برای فعال شدن سینک)</button>' : "") +
    '<button class="gsf-btn ghost" id="gsf-clean">آزادسازی حافظه مرورگر (تعمیر دکمه ذخیره)</button>' +
    '<button class="gsf-btn" id="gsf-export">دریافت کد انتشار برای گیت‌هاب</button>' +
    '<textarea class="gsf-ta" id="gsf-code" style="display:none" readonly></textarea>' +
    '<div id="gsf-panel-msg"></div>';
  bg.appendChild(m);
  document.body.appendChild(bg);
  bg.addEventListener("click", function(e){ if(e.target === bg) bg.remove(); });
  $("gsf-close").onclick = function(){ bg.remove(); };
  $("gsf-clean").onclick = function(){
    var n = freeSpace();
    toast(n ? "حافظه آزاد شد (" + n + " مورد پاکسازی شد). حالا دکمه ذخیره کار می‌کند." : "حافظه مشکلی نداشت.", false);
  };
  var login = $("gsf-login");
  if(login) login.onclick = function(){
    var p = prompt("رمز مدیریت را وارد کن:");
    if(p === GSF_ADMIN){ origSet.call(localStorage, "__gsf_admin", p); toast("مدیر وارد شد — سینک ابری روشن است."); bg.remove(); openPanel(); }
    else if(p !== null) toast("رمز اشتباه است.", true);
  };
  $("gsf-export").onclick = function(){
    var ta = $("gsf-code");
    ta.style.display = "block";
    ta.value = buildExport();
    copyText(ta.value, function(){ toast("کد کپی شد! حالا توی فایل index.html توی گیت‌هاب، دیتای بازی‌ها رو با این کد جایگزین و Commit کن."); });
  };
}
function addFab(){

  var b = document.createElement("button");
  b.className = "gsf-fab"; b.id = "gsf-fab";

}

/* ---------- هشدار کنار فرم آپلود فایل ---------- */
function warnFileInputs(){
  var fs = document.querySelectorAll("input[type=file]:not(.gsf-marked)");
  for(var i = 0; i < fs.length; i++){
    fs[i].classList.add("gsf-marked");
    var d = document.createElement("div");

    d.textContent = "به‌جای آپلود فایل، لینک عکس وارد کن (راست‌کلیک روی عکس توی اینترنت ← Copy image address). عکس فایلی فقط روی سیستم خودت ذخیره می‌شه و حافظه مرورگر رو پر می‌کنه — همون چیزی که دکمه ذخیره رو خراب کرده بود.";
    fs[i].insertAdjacentElement("afterend", d);
  }
}

var tries = 0;
var iv = setInterval(function(){
  addFab(); warnFileInputs();
  if(++tries > 40) clearInterval(iv);
}, 1200);
addFab(); warnFileInputs(); cloudPull();
window.__gsf = { detect: detectGamesKey, freeSpace: freeSpace, exportCode: buildExport };
})();

  function createNeonPoster(title, color1='#1e1b4b', color2='#7c3aed') {
    const cleanTitle = (title || 'Game').substring(0, 18).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${color1}"/><stop offset="100%" stop-color="${color2}"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><circle cx="150" cy="160" r="55" fill="#d946ef" opacity="0.15"/><text x="50%" y="165" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="48" font-family="sans-serif">🎮</text><text x="50%" y="270" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900" font-family="sans-serif">${cleanTitle}</text></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function generateDefaultSysReq(title, year, platform) {
    if (platform && (platform.toLowerCase().includes('mobile') || platform.toLowerCase().includes('android') || platform.toLowerCase().includes('ios'))) {
      return 'اندروید ۷.۰ به بالا / iOS 12.0 به بالا | حداقل رم: 3GB';
    }
    const y = parseInt(year) || 2020;
    if (y >= 2022) {
      return 'RAM: 16GB | GPU: GTX 1660 Super / RTX 2060 | CPU: Intel Core i5-10400 | Storage: 75GB';
    } else if (y >= 2018) {
      return 'RAM: 12GB | GPU: GTX 1060 (6GB) / RX 580 | CPU: Intel Core i5-8400 | Storage: 60GB';
    } else {
      return 'RAM: 8GB | GPU: GTX 960 / GTX 1050 Ti | CPU: Intel Core i5-4460 | Storage: 40GB';
    }
  }

  function resizeAndCompressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const MAX_WIDTH = 500;
          let scale = 1;
          if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const base64Str = canvas.toDataURL('image/jpeg', 0.6);
          resolve(base64Str);
        };
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function getFilteredList() {
    let list = games.slice();
    if (mobileModeOnly) {
      list = list.filter(g => g.isMobile || (g.platform && (g.platform.includes('Android') || g.platform.includes('Mobile') || g.platform.includes('iOS'))));
    } else {
      list = list.filter(g => !g.isMobile);
    }

    const search = $('searchInput').value.trim().toLowerCase();
    if(search) {
      list = list.filter(g => (g.title||'').toLowerCase().includes(search) || (g.genres && g.genres.some(genre => genre.toLowerCase().includes(search))));
    }
    const selectedPlatforms = getSelectedPlatforms();
    if(selectedPlatforms.length > 0) {
      list = list.filter(g => selectedPlatforms.some(p => (g.platform || '').includes(p)));
    }
    if(wishOnly) {
      const wish = JSON.parse(localStorage.getItem('gl_wishlist') || '[]');
      list = list.filter(g => wish.includes(g.id));
    }
    return list;
  }

      </div>
    ` : '';

    const genresHtml = (g.genres || []).map(x => `<span style="background:var(--border); padding:4px 10px; border-radius:12px; font-size:11px;">${escapeHtml(x)}</span>`).join('');

    const downloadUrl = g.downloadUrl || `https://www.google.com/search?q=${encodeURIComponent('دانلود بازی ' + g.title)}`;
    const downloadBtnHtml = `
      <a href="${downloadUrl}" target="_blank" rel="noopener" class="btn-download-iran">
        📥 دانلود بازی (جستجوی مستقیم لینک دانلود)
      </a>
    `;

    const sysReqText = g.sysMin || generateDefaultSysReq(g.title, g.year, g.platform);
    const sysMinHtml = `
      <div class="sys-req-box">
        <div class="sys-req-title">💻 حداقل سیستم مورد نیاز:</div>
        <p style="font-size:12px; color:var(--text-main); font-family:monospace; direction:ltr; text-align:left; line-height:1.6;">${escapeHtml(sysReqText)}</p>
      </div>
    `;

    body.innerHTML = `
      <div style="display:flex; gap:16px; flex-direction:column; align-items:center;">
        <img id="mainDetailPhoto" src="${poster}" onerror="this.onerror=null; this.src='${fallbackSvg}';" style="width:180px; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,0.5);">
        
        ${galleryHtml}

        <div style="text-align:center; width:100%;">
          <h2 style="font-size:24px; font-weight:900; color:var(--primary); margin-bottom:8px;" dir="ltr">${escapeHtml(g.title)}</h2>
          
          <div style="display:flex; gap:5px; justify-content:center; flex-wrap:wrap; margin:10px 0;">
            ${genresHtml}
          </div>

          <p style="color:var(--text-muted); margin:8px 0; font-size:13px;">پلتفرم: ${escapeHtml(g.platform || 'نامشخص')}</p>
          <p style="color:var(--text-muted); font-size:13px;">سال انتشار: ${escapeHtml(g.year || 'نامشخص')}</p>
          <div style="margin-top:10px; font-size:16px; font-weight:bold; color:var(--text-main);">امتیاز سایت: <span style="color:var(--pink-neon);">${escapeHtml(g.rating || '۱۰')}</span>/۱۰</div>
          
          ${downloadBtnHtml}

          <a href="${autoTrailerLink}" target="_blank" rel="noopener" style="display:inline-block; margin-top:15px; color:var(--pink-neon); font-size:13px; font-weight:bold; text-decoration:underline;">
            🎬 تماشای تریلر ویدیویی بازی (بدون فیلترشکن)
          </a>

          ${sysMinHtml}

          <div style="margin-top:20px; text-align:justify; background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; border:1px solid var(--border);">
            <strong style="color:var(--pink-neon); font-size:14px;">داستان و معرفی بازی:</strong><br>
            <p style="margin-top:8px; line-height:1.8; font-size:13px; color:var(--text-main);">${escapeHtml(g.review || 'هنوز داستانی برای این بازی ثبت نشده است.')}</p>
          </div>
          
          ${adminActionsHtml}

          <button class="btn-modal-back" onclick="closeOverlay('detailOverlay')">
            ⬅️ بازگشت به لیست بازی‌ها
          </button>
        </div>
      </div>
    `;
    $('detailOverlay').classList.remove('hidden');
  };

  window.closeOverlay = function(id) {
    $(id).classList.add('hidden');
  };

  $('siteTitle').ondblclick = function() {
    if (isAdmin) {
      if (confirm('آیا قصد خروج از حالت مدیریت را دارید؟')) {
        isAdmin = false;
        localStorage.removeItem('gl_is_admin');
        $('btnAddGame').classList.add('hidden');
        $('btnAdminBackup').classList.add('hidden');
        renderShelf();
        showToast('از حالت مدیریت خارج شدید 👋');
      }
    } else {
      const pass = prompt('رمز ورود مدیر:');
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        localStorage.setItem('gl_is_admin', 'true');
        $('btnAddGame').classList.remove('hidden');
        $('btnAdminBackup').classList.remove('hidden');
        renderShelf();
        showToast('ورود مدیر موفقیت‌آمیز بود 👑');
      } else if (pass !== null) {
        showToast('رمز عبور اشتباه است ❌');
      }
    }
  };

  $('searchInput').oninput = () => { currentPage = 1; renderShelf(); };

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2000);
  }

})();
</script>
</body>
</html>
