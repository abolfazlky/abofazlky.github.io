<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معرفی بازی — کاتالوگ و مرجع بازی‌های ویدیویی</title>
<meta name="description" content="معرفی بازی — کاتالوگ شخصی معرفی و بررسی بازی‌های ویدیویی با ژانرهای مختلف و امتیازدهی.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0d12;
    --bg-card: #171923;
    --bg-card-hover: #212536;
    --bg-panel: #13151f;
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --pink-neon: #d946ef;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: #252a3e;
    --red-danger: #dc2626;
    --gold: #fbbf24;
  }

  body.light {
    --bg-main: #f1f5f9; --bg-card: #ffffff; --bg-card-hover: #f8fafc;
    --bg-panel: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; }
  body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; outline: none; background: none; }

  /* Layout */
  .app-container { display: flex; flex-direction: column; min-height: 100vh; }
  header.top-bar {
    height: 70px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 40;
  }

  .brand-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-logo .logo-icon {
    width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--pink-neon));
    border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;
  }
  .brand-logo h1 { font-size: 22px; font-weight: 900; color: white; }
  body.light .brand-logo h1 { color: var(--text-main); }

  .header-left { display: flex; align-items: center; gap: 10px; }
  .search-box { position: relative; width: 240px; }
  .search-box input {
    width: 100%; padding: 8px 36px 8px 12px; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); font-size: 12px;
  }
  .search-box input:focus { border-color: var(--primary); outline: none; }
  .search-box .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }

  .main-wrapper { display: flex; flex: 1; position: relative; }
  .nav-rail {
    width: 70px; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 22px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 20px; transition: all 0.2s;
  }
  .rail-btn:hover, .rail-btn.active { background: var(--primary); color: white; }

  .content-area { flex: 1; padding: 28px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title { font-size: 20px; font-weight: 800; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 35px; }
  .game-card-modern {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    transition: transform 0.2s, border-color 0.2s; cursor: pointer; display: flex; flex-direction: column; position: relative;
  }
  .game-card-modern:hover { transform: translateY(-5px); border-color: var(--primary); }
  .card-poster { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #171923; }
  .card-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .card-title-text { font-size: 15px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; direction: ltr; }
  .card-genres { font-size: 11px; color: var(--primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-footer-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }

  .admin-delete-btn {
    position: absolute; top: 8px; right: 8px; background: rgba(220, 38, 38, 0.85); color: white;
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 10;
  }

  .promo-banner {
    background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%); border: 2px solid var(--pink-neon); border-radius: 20px;
    padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; margin: 35px 0;
  }
  .banner-content h3 { font-size: 22px; font-weight: 900; color: white; margin-bottom: 6px; }
  .banner-content p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
  .banner-btn { background: var(--primary); color: white; padding: 10px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; }

  .filter-panel { width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 24px 18px; display: flex; flex-direction: column; gap: 24px; z-index: 30; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 800; }
  .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
  .checkbox-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.02); border-radius: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .checkbox-item input { accent-color: var(--primary); }
  .btn-reset-filters { background: var(--red-danger); color: white; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-top: auto; }

  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; }
  .page-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
  .hidden { display: none !important; }
  .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
  .modal-close { position: absolute; top: 14px; left: 14px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); color: white; display: flex; align-items: center; justify-content: center; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 13px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

  /* Gallery UI */
  .gallery-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
  .gallery-thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
  .gallery-thumbs img.active { border-color: var(--pink-neon); transform: scale(1.05); }

  /* Comments UI */
  .comment-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .comment-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 6px; }
  .comment-author { color: var(--pink-neon); font-weight: bold; }
  
  /* Rating Stars UI */
  .rating-stars { display: flex; gap: 6px; justify-content: center; margin: 15px 0; direction: ltr; }
  .star-btn { font-size: 26px; color: #4b5563; transition: 0.2s; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
  .star-btn.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
  .star-btn:hover { transform: scale(1.2); }

  .btn-add-game {
    background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .user-avatar-btn {
    width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .empty-note{ grid-column:1/-1; text-align:center; padding:50px 20px; color: var(--text-muted); font-size:14px; }

  @media (max-width: 768px) {
    header.top-bar { padding: 0 12px; height: 60px; }
    .brand-logo h1 { font-size: 16px; }
    .search-box { width: 120px; }
    .nav-rail { display: none; }
    .filter-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 80%; max-width: 280px; }
    .content-area { padding: 16px 12px; }
    .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .promo-banner { flex-direction: column; text-align: center; gap: 12px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <header class="top-bar">
    <div class="brand-logo" id="siteTitle" title="دوبار کلیک برای ورود مدیر">
      <div class="logo-icon">🎮</div>
      <h1>معرفی بازی</h1>
    </div>
    <div class="header-left">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="جستجو...">
      </div>
      <button class="rail-btn" onclick="$('filterDrawer').classList.toggle('hidden')" style="width:38px; height:38px; font-size:16px;">🎛️</button>
      <button class="user-avatar-btn" id="userAccountBtn" onclick="handleAuthClick()" title="حساب کاربری">👤</button>
      <a href="https://t.me/Abolfazlkya" target="_blank" class="rail-btn" title="تلگرام" style="width:38px; height:38px; font-size:16px;">✈️</a>
      <button class="rail-btn" id="themeToggleBtn" style="width:38px; height:38px; font-size:16px;">🌙</button>
    </div>
  </header>

  <div class="main-wrapper">
    <aside class="filter-panel hidden" id="filterDrawer">
      <div class="panel-header"><span>پلتفرم‌ها</span><button class="modal-close" style="position:static;" onclick="$('filterDrawer').classList.add('hidden')">✕</button></div>
      <div class="checkbox-group" id="platformCheckboxes">
        <label class="checkbox-item"><span>🖥️ PC</span><input type="checkbox" value="PC" onchange="filterGames()"></label>
        <label class="checkbox-item"><span>🟢 Xbox</span><input type="checkbox" value="Xbox" onchange="filterGames()"></label>
        <label class="checkbox-item"><span>🟦 PlayStation</span><input type="checkbox" value="PS" onchange="filterGames()"></label>
        <label class="checkbox-item"><span>🔴 Switch</span><input type="checkbox" value="Switch" onchange="filterGames()"></label>
        <label class="checkbox-item"><span>📱 Mobile</span><input type="checkbox" value="Mobile" onchange="filterGames()"></label>
      </div>
      <button class="btn-reset-filters" onclick="resetAllFilters()">🗑️ پاک کردن فیلترها</button>
    </aside>

    <main class="content-area">
      <div class="section-header">
        <div><div class="section-title">همه بازی ها</div><div class="section-subtitle">جدیدترین و محبوب‌ترین بازی‌ها</div></div>
        <button class="btn-add-game hidden" id="btnAddGame" onclick="openForm(null)"><span>+</span> افزودن بازی</button>
      </div>
      <div class="games-grid" id="shelf"></div>
      <div class="pagination-container" id="paginationBox"></div>
      <div class="promo-banner">
        <div class="banner-content"><h3>بازی های دورهمی 🎉</h3><p>مناسب جمع و مهمانی‌های دوستانه</p><button class="banner-btn" onclick="filterGenre('چندنفره')">مشاهده بازی ها ➔</button></div>
        <div style="font-size:50px;">🕹️</div>
      </div>

      <div class="section-header" style="margin-top:30px;">
        <div><div class="section-title">بازی های محبوب ❤️</div><div class="section-subtitle">محبوب‌ترین بازی‌های این قفسه</div></div>
      </div>
      <div class="games-grid" id="popularShelf"></div>
    </main>

    <nav class="nav-rail">
      <button class="rail-btn active" onclick="$('filterDrawer').classList.toggle('hidden')">🎛️</button>
      <button class="rail-btn" onclick="resetAllFilters()">🏠</button>
      <button class="rail-btn" onclick="toggleWishlistOnly()" id="btnWishlistRail" title="نشان‌شده‌ها">⭐</button>
    </nav>
  </div>
</div>

<!-- Login Modal (غیر اجباری) -->
<div id="authScreen" class="overlay hidden">
  <div class="modal-card" style="max-width:380px; background:var(--bg-card); padding:30px; text-align:center;">
    <button class="modal-close" onclick="closeOverlay('authScreen')">✕</button>
    <h2 style="font-size:22px; font-weight:900; color:var(--primary); margin-bottom:20px;">ورود به حساب کاربری</h2>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">برای ثبت نظر، امتیاز و لیست علاقه‌مندی‌ها وارد شوید.</p>
    <div class="field"><input type="text" id="userInput" placeholder="شماره موبایل یا ایمیل" style="text-align:center; direction:ltr;"></div>
    <button onclick="submitLogin()" style="width:100%; padding:12px; background:var(--primary); color:white; border-radius:12px; font-weight:800;">ورود 🚀</button>
  </div>
</div>

<!-- Details Modal -->
<div id="detailOverlay" class="overlay hidden">
  <div class="modal-card" style="max-width:800px;">
    <button class="modal-close" onclick="closeOverlay('detailOverlay')">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- Add/Edit Game Modal -->
<div id="formOverlay" class="overlay hidden">
  <div class="modal-card" style="max-width:550px;">
    <button class="modal-close" onclick="closeOverlay('formOverlay')">✕</button>
    <h2 id="formTitle" style="margin-bottom:16px;">افزودن/ویرایش بازی</h2>
    <div class="field"><label>عنوان بازی (انگلیسی)</label><input type="text" id="fTitle" dir="ltr" placeholder="Elden Ring"></div>
    <div style="display:flex; gap:10px;">
      <div class="field" style="flex:1;"><label>پلتفرم</label><input type="text" id="fPlatform" placeholder="PC / PS5" dir="ltr"></div>
      <div class="field" style="width:100px;"><label>سال</label><input type="number" id="fYear"></div>
      <div class="field" style="width:100px;"><label>امتیاز</label><input type="number" id="fRating" max="10"></div>
    </div>
    <div class="field"><label>ژانرها (با ویرگول جدا کنید)</label><input type="text" id="fGenres" placeholder="اکشن, نقش‌آفرینی"></div>
    
    <!-- آپلود گالری (چندتایی) -->
    <div class="field">
      <label>آپلود عکس‌ها (می‌توانید چند عکس همزمان انتخاب کنید)</label>

      <div id="fGalleryPreview" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>
    </div>
    
    <div class="field"><label>داستان و معرفی بازی</label><textarea id="fReview" style="height:100px;"></textarea></div>
    <button id="saveFormBtn" onclick="saveGameFromForm()" style="width:100%; padding:12px; background:var(--primary); color:white; border-radius:12px; font-weight:800;">ذخیره اطلاعات بازی 💾</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

  function generateFullGamesDatabase() {
    return rawGameData.map((g, i) => {
      return {
        id: 'seed_' + i,
        title: g[0],
        platform: g[1],
        year: g[2],
        rating: g[3],

  function loadGamesFast() {

  async function syncWithServerBackground() {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1500); 
      const res = await fetch(`${FIREBASE_URL}/games.json`, { signal: controller.signal });
      clearTimeout(timer);
      if (res.ok) {
        const data = await res.json();
        if (data && data.length > 0) {
          games = data;
          localStorage.setItem('gl_games_db_v6', JSON.stringify(games));
          renderShelf();
          renderPopular();
        }
      }
    } catch(e) {}
  }

  async function saveGamesToStorage() {
    localStorage.setItem('gl_games_db_v6', JSON.stringify(games));
    try {
      await fetch(`${FIREBASE_URL}/games.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(games)
      });
    } catch(e) {}
  }

  // ----- سیستم چند عکسی (Gallery Upload) -----
  function resizeImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 480; 
          const scale = Math.min(1, maxW/img.width);
          const w = img.width*scale, h = img.height*scale;
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.65)); 
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  $('fImgFile').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    for (const file of files) {
      if (pendingImages.length >= 8) {
        showToast('حداکثر ۸ عکس می‌توانید آپلود کنید.');
        break;
      }
      try {
        const b64 = await resizeImage(file);
        pendingImages.push(b64);
      } catch(e) { }
    }
    renderFormGallery();
  });

  window.removePendingImage = function(index) {

  function renderFormGallery() {
    const box = $('fGalleryPreview');
    if(pendingImages.length === 0) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML = pendingImages.map((src, i) => `
      <div style="position:relative;">
        <img src="${src}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--border);">
        <button onclick="removePendingImage(${i})" type="button" style="position:absolute; top:-5px; right:-5px; background:var(--red-danger); color:white; width:20px; height:20px; border-radius:50%; font-size:10px;">X</button>

        $('fRating').value = g.rating || '';

        // اگر عکسی قبلا بوده، آن را به pendingImages اضافه می‌کنیم تا قابل ویرایش باشد
        if (g.images && g.images.length > 0 && !g.images[0].startsWith('data:image/svg')) {
           pendingImages = [...g.images];
        }
        $('fReview').value = g.review || '';
      }
    } else {
      $('formTitle').textContent = 'افزودن بازی جدید';
      $('fTitle').value = '';
      $('fPlatform').value = '';
      $('fYear').value = '';

  window.saveGameFromForm = async function() {
    const title = $('fTitle').value.trim();
    if (!title) return alert('لطفا عنوان بازی را وارد کنید.');

    // اگر عکسی آپلود نکرده باشد، پوستر نئونی جایگزین می‌شود
    const finalImages = pendingImages.length > 0 ? pendingImages : [createNeonPoster(title)];

    const newGame = {
      id: editingId || ('g_' + Date.now()),
      title: title,
      platform: $('fPlatform').value.trim() || 'PC / Console',
      year: $('fYear').value.trim() || '2024',
      rating: $('fRating').value.trim() || '10',
      genres: $('fGenres').value.split(',').map(s=>s.trim()).filter(Boolean),
      images: finalImages,
      review: $('fReview').value.trim() || 'توضیحات بازی ثبت نشده است.',
      favorite: false
    };

    if (editingId) {
      games = games.map(g => g.id === editingId ? newGame : g);
    } else {
      games.unshift(newGame);
    }

    await saveGamesToStorage();
    closeOverlay('formOverlay');
    renderShelf();
    renderPopular();
    showToast('اطلاعات بازی ذخیره شد 💾');

  function getSelectedPlatforms() {
    const checkboxes = document.querySelectorAll('#platformCheckboxes input:checked');
    return Array.from(checkboxes).map(cb => cb.value);
  }

  function getFilteredList() {
    let list = games.slice();
    const search = $('searchInput').value.trim().toLowerCase();
    if(search) {
      list = list.filter(g => g.title.toLowerCase().includes(search) || (g.genres && g.genres.some(genre => genre.toLowerCase().includes(search))));
    }
    const selectedPlatforms = getSelectedPlatforms();
    if(selectedPlatforms.length > 0) {
      list = list.filter(g => selectedPlatforms.some(p => (g.platform || '').toLowerCase().includes(p.toLowerCase())));
    }
    if(wishOnly) {
      const wish = JSON.parse(localStorage.getItem('gl_wishlist') || '[]');
      list = list.filter(g => wish.includes(g.id));
    }
    return list;
  }

  function renderShelf() {
    const shelf = $('shelf');
    shelf.innerHTML = '';
    const list = getFilteredList();

    const start = (currentPage - 1) * GAMES_PER_PAGE;
    const paginated = list.slice(start, start + GAMES_PER_PAGE);

    if(paginated.length === 0) {
      shelf.innerHTML = '<p style="color:var(--text-muted); grid-column:1/-1; text-align:center; padding:40px;">بازی‌ای یافت نشد!</p>';
    }

    paginated.forEach(g => {
      const card = document.createElement('div');
      card.className = 'game-card-modern';
      const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);
      const fallbackSvg = createNeonPoster(g.title);
      const deleteBtnHtml = isAdmin ? `<button class="admin-delete-btn" onclick="event.stopPropagation(); deleteGame('${g.id}')">✕</button>` : '';

      card.innerHTML = `
        ${deleteBtnHtml}
        <img class="card-poster" src="${poster}" alt="${g.title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackSvg}';">
        <div class="card-info">

        </div>

      card.onclick = () => openDetail(g.id);
      shelf.appendChild(card);
    });
    renderPagination(list.length);
  }

  function renderPagination(total) {

    box.innerHTML = '';
    if(pages <= 1) return;
    for(let i=1; i<=pages; i++) {

      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');

      openDetail(gameId); // رفرش ظاهری
      // ارسال به فایربیس بدون متوقف کردن کاربر

      const text = $('newCommentText').value.trim();
      if(!text) return showToast('لطفاً نظر خود را بنویسید.');
      
      const comment = { author: user, text: text, time: new Date().toLocaleDateString('fa-IR') };

            <h3 style="font-size:16px; color:var(--primary); margin-bottom:15px;">💬 نظرات گیمرها</h3>
            <div id="commentsBoxContainer">
               <p style="font-size:12px; color:var(--text-muted); text-align:center;">در حال بارگذاری نظرات...</p>
            </div>
            
            <textarea id="newCommentText" placeholder="نظرت در مورد این بازی چیه؟..." style="margin-top:15px; height:70px;"></textarea>
            <button onclick="submitComment('${id}')" style="width:100%; padding:10px; background:var(--primary); color:white; border-radius:10px; margin-top:10px; font-weight:bold;">ثبت نظر 🚀</button>
          </div>

        </div>
      </div>
    `;
    $('detailOverlay').classList.remove('hidden');

    // لود نظرات در پس زمینه
    loadCommentsForGame(id);
  };

  async function loadCommentsForGame(id) {
    let html = '';
    // اول نمایش کامنت‌های آفلاین
    const localComms = JSON.parse(localStorage.getItem(`comments_${id}`) || '[]');
    if(localComms.length > 0) {
      html += localComms.map(c => `
        <div class="comment-box">
          <div class="comment-meta"><span class="comment-author">👤 ${escapeHtml(c.author)}</span><span>${c.time}</span></div>
          <div class="comment-text">${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    }

    // لود از فایربیس
    try {
      const res = await fetch(`${FIREBASE_URL}/comments/${id}.json`);
      if(res.ok) {
        const data = await res.json();
        if(data) {
          const fbComms = Object.values(data);
          // ترکیب برای جلوگیری از تکرار
          const allComms = [...fbComms]; 
          html = allComms.map(c => `
            <div class="comment-box">
              <div class="comment-meta"><span class="comment-author">👤 ${escapeHtml(c.author)}</span><span>${c.time}</span></div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
            </div>
          `).join('');
        }
      }
    } catch(e) {}

    $('commentsBoxContainer').innerHTML = html || '<p style="font-size:12px; color:var(--text-muted); text-align:center;">هنوز نظری ثبت نشده. اولین نفر باشید!</p>';
  }

  window.closeOverlay = function(id) {
    $(id).classList.add('hidden');
  };

  $('siteTitle').ondblclick = function() {
    const pass = prompt('رمز ورود مدیر:');
    if(pass === ADMIN_PASSWORD) {
      isAdmin = true;
      $('btnAddGame').classList.remove('hidden');
      renderShelf();
      showToast('ورود مدیر موفقیت‌آمیز بود 👑');
    }
  };

  $('searchInput').oninput = () => { currentPage = 1; renderShelf(); };
  function showToast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2000);
  }
  $('themeToggleBtn').onclick = () => { document.body.classList.toggle('light'); };

})();
</script>
</body>
</html>
