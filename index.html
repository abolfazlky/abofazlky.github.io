<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معرفی بازی — کاتالوگ و مرجع بازی‌های ویدیویی</title>
<meta name="description" content="معرفی بازی — کاتالوگ شخصی معرفی و بررسی بازی‌های ویدیویی با ژانرهای مختلف و امتیازدهی.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0d12;
    --bg-card: #171923;
    --bg-card-hover: #212536;
    --bg-panel: #13151f;
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --pink-neon: #d946ef;
    --accent: #a855f7;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: #252a3e;
    --red-danger: #dc2626;
  }

  body.light {
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --bg-card-hover: #f8fafc;
    --bg-panel: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; outline: none; background: none; font-family: inherit; }
  input, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--pink-neon); outline-offset: 2px; }

  .app-container { display: flex; flex-direction: column; min-height: 100vh; }

  header.top-bar {
    height: 70px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    position: sticky; top: 0; z-index: 40;
  }

  .brand-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-logo .logo-icon {
    width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--pink-neon));
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: white; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
  }
  .brand-logo h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; color: white; }
  body.light .brand-logo h1 { color: var(--text-main); }

  .header-left { display: flex; align-items: center; gap: 10px; }

  .search-box { position: relative; width: 220px; }
  .search-box input {
    width: 100%; padding: 8px 36px 8px 12px; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); font-size: 12px;
  }
  .search-box input:focus { border-color: var(--primary); }
  .search-box .search-icon {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 13px; pointer-events: none;
  }

  .main-wrapper { display: flex; flex: 1; position: relative; }

  .nav-rail {
    width: 70px; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 22px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; color: var(--text-muted); font-size: 20px; transition: all 0.2s;
  }
  .rail-btn:hover, .rail-btn.active { background: var(--primary); color: white; box-shadow: 0 0 12px rgba(124,58,237,0.4); }

  .content-area { flex: 1; padding: 28px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 20px; font-weight: 800; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .btn-add-game {
    background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
  }

  .games-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px; margin-bottom: 35px;
  }
  .empty-note{ grid-column:1/-1; text-align:center; padding:50px 20px; color: var(--text-muted); font-size:14px; }

  .game-card-modern {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    cursor: pointer; display: flex; flex-direction: column; position: relative;
  }
  .game-card-modern:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .card-poster { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #171923; display:block; }
  .card-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .card-title-text {
    font-size: 15px; font-weight: 800; color: var(--text-main);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: left; direction: ltr;
  }
  .card-genres { font-size: 11px; color: var(--primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-footer-row {
    display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted);
    margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05);
  }
  .card-footer-row .platform-badge{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px; }

  .admin-delete-btn {
    position: absolute; top: 8px; right: 8px; background: rgba(220, 38, 38, 0.9); color: white;
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 12px; z-index: 10;
  }

  .promo-banner {
    background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%);
    border: 2px solid var(--pink-neon); border-radius: 20px; padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between; margin: 35px 0;
    box-shadow: 0 0 25px rgba(217, 70, 239, 0.25); flex-wrap: wrap; gap: 16px;
  }
  .banner-content h3 { font-size: 22px; font-weight: 900; color: white; margin-bottom: 6px; }
  .banner-content p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
  .banner-btn { background: var(--primary); color: white; padding: 10px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; }

  .filter-panel {
    width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border);
    padding: 24px 18px; display: flex; flex-direction: column; gap: 24px; z-index: 30;
  }
  .panel-header { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 800; }
  .section-links { display: flex; flex-direction: column; gap: 10px; }
  .link-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 10px; font-size: 13px; color: var(--text-muted); }
  .link-item:hover { background: var(--bg-card-hover); color: var(--text-main); }

  .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
  .checkbox-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.02); border-radius: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .checkbox-item input { accent-color: var(--primary); }

  .btn-reset-filters { background: var(--red-danger); color: white; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
  .page-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
  .hidden { display: none !important; }
  .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
  .modal-close { position: absolute; top: 14px; left: 14px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); color: white; display: flex; align-items: center; justify-content: center; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-main); font-size: 13px;
  }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

  @media (max-width: 768px) {
    header.top-bar { padding: 0 12px; height: 60px; }
    .brand-logo h1 { font-size: 16px; }
    .brand-logo .logo-icon { width: 32px; height: 32px; font-size: 16px; }
    .search-box { width: 110px; }
    .search-box input { padding: 6px 26px 6px 8px; font-size: 11px; }
    .nav-rail { display: none; }
    .filter-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 80%; max-width: 280px; box-shadow: -5px 0 30px rgba(0,0,0,0.8); overflow-y:auto; }
    .content-area { padding: 16px 12px; }
    .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card-info { padding: 8px; gap: 4px; }
    .card-title-text { font-size: 13px; }
    .promo-banner { flex-direction: column; text-align: center; padding: 18px 14px; gap: 12px; }
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="top-bar">
    <div class="brand-logo" id="siteTitle" title="دوبار کلیک برای ورود مدیر">

    { id: '4', title: 'Zelda: Breath of the Wild', platform: 'Nintendo Switch', year: '2017', rating: '10', genres: ['ماجراجویی', 'دنیای‌باز', 'نقش‌آفرینی'], images: [createNeonPoster('Zelda: BOTW', '#064e3b', '#10b981')], favorite: true, review: 'لینک پس از صد سال از خواب بیدار می‌شود تا پادشاهی هایرول را از دست گانون نابودگر نجات دهد. نهایت آزادی عمل در گیم‌پلی.' },
    { id: '5', title: 'Among Us', platform: 'Mobile / PC / Switch', year: '2018', rating: '8', genres: ['چندنفره', 'پارتی', 'بقا'], images: [createNeonPoster('Among Us', '#881337', '#e11d48')], favorite: false, review: 'شما در یک سفینه فضایی هستید اما یک یا چند قاتل (Impostor) میان شما پنهان شده‌اند. بازی به شدت سرگرم‌کننده دورهمی.' },
    { id: '6', title: 'Red Dead Redemption 2', platform: 'PC / PS4 / Xbox', year: '2018', rating: '10', genres: ['اکشن', 'ماجراجویی', 'دنیای‌باز'], images: [createNeonPoster('RDR 2', '#7f1d1d', '#b91c1c')], favorite: true, review: 'داستان آرتور مورگان و باند داتچ در دوران افول غرب وحشی. یکی از بهترین داستان‌سرایی‌ها و دنیاهای خلق شده در تاریخ بازی‌ها.' },
    { id: '7', title: 'Minecraft', platform: 'PC / Console / Mobile', year: '2011', rating: '9.5', genres: ['ساخت‌وساز', 'بقا', 'خلاقانه'], images: [createNeonPoster('Minecraft', '#365314', '#4d7c0f')], favorite: true, review: 'جهانی بی‌انتها از بلوک‌ها که در آن می‌توانید هرچیزی که تصور می‌کنید بسازید یا برای بقا تلاش کنید.' }
  ];

  async function fbGet(key){
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 4000);
      const res = await fetch(`${FIREBASE_URL}/${key}.json`, { signal: controller.signal });
      clearTimeout(timer);
      if(!res.ok) return null;
      const data = await res.json();
      return (data===null||data===undefined) ? null : data;
    }catch(e){ return null; }
  }
  async function fbSet(key, value){
    try{
      const res = await fetch(`${FIREBASE_URL}/${key}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value)
      });
      return res.ok;
    }catch(e){ return false; }
  }

  function migrate(list){
    return (list||[]).map(g=>{
      if(!g.images) g.images = [];
      if(!g.genres) g.genres = [];
      if(g.favorite===undefined) g.favorite = false;
      return g;
    });
  }

  window.onload = function(){ loadGamesFast(); };

  function loadGamesFast(){
    const local = localStorage.getItem('gl_games_db_v4');
    if(local){
      try{ games = migrate(JSON.parse(local)); }catch(e){ games = migrate(SAMPLE_GAMES.slice()); }
    } else {
      games = migrate(SAMPLE_GAMES.slice());
      localStorage.setItem('gl_games_db_v4', JSON.stringify(games));
    }
    renderShelf();
    renderPopular();
    syncWithServerBackground();
  }

  async function syncWithServerBackground(){
    const data = await fbGet('games');
    if(data){
      try{
        const parsed = typeof data === 'string' ? JSON.parse(data) : data;
        if(parsed && parsed.length > 0){
          games = migrate(parsed);
          localStorage.setItem('gl_games_db_v4', JSON.stringify(games));
          renderShelf();
          renderPopular();
        }
      }catch(e){}
    } else {
      saveGamesToStorage();
    }
  }

  async function saveGamesToStorage(){
    localStorage.setItem('gl_games_db_v4', JSON.stringify(games));
    const ok = await fbSet('games', JSON.stringify(games));
    if(!ok){ showToast('ذخیره پشت‌صحنه انجام نشد؛ رو همین دستگاه ذخیره‌ست.'); }
  }

  window.openForm = function(id){
    editingId = id;
    const g = id ? games.find(x=>x.id===id) : null;
    $('formTitle').textContent = g ? 'ویرایش بازی' : 'افزودن بازی جدید';
    $('fTitle').value = g ? g.title : '';
    $('fPlatform').value = g ? (g.platform||'') : '';
    $('fYear').value = g ? (g.year||'') : '';
    $('fRating').value = g ? (g.rating||'') : '';
    $('fGenres').value = g ? (g.genres||[]).join(', ') : '';
    const existingImg = g && g.images && g.images[0] && !g.images[0].startsWith('data:image/svg') ? g.images[0] : '';
    $('fImgUrl').value = existingImg;
    pendingImageData = '';
    $('fImgFile').value = '';
    if(g && g.images && g.images[0]){ $('fImgPreview').src = g.images[0]; $('fImgPreviewWrap').classList.remove('hidden'); }
    else { $('fImgPreviewWrap').classList.add('hidden'); }
    $('fFavorite').checked = g ? !!g.favorite : false;
    $('fReview').value = g ? (g.review||'') : '';
    $('formOverlay').classList.remove('hidden');
  };

  function resizeImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 700;
          const scale = Math.min(1, maxW/img.width);
          const w = img.width*scale, h = img.height*scale;
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  $('fImgFile').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImage(file);
      pendingImageData = dataUrl;
      $('fImgUrl').value = '';
      $('fImgPreview').src = dataUrl;
      $('fImgPreviewWrap').classList.remove('hidden');
    }catch(e){ showToast('نتونستم عکس رو بخونم.'); }
  });
  $('fImgClearBtn').addEventListener('click', ()=>{
    pendingImageData = '';
    $('fImgUrl').value = '';
    $('fImgFile').value = '';
    $('fImgPreviewWrap').classList.add('hidden');
  });
  $('fImgUrl').addEventListener('input', ()=>{
    const val = $('fImgUrl').value.trim();
    if(val){ pendingImageData = ''; $('fImgPreview').src = val; $('fImgPreviewWrap').classList.remove('hidden'); }
  });

  $('saveFormBtn').addEventListener('click', async ()=>{
    const title = $('fTitle').value.trim();
    if(!title){ showToast('عنوان رو وارد کن.'); return; }
    const currentImg = editingId ? (games.find(g=>g.id===editingId)||{}).images?.[0] : null;
    const finalImage = pendingImageData || $('fImgUrl').value.trim() || currentImg || createNeonPoster(title);
    const newGame = {
      id: editingId || ('g_' + Date.now()),
      title,
      platform: $('fPlatform').value.trim() || 'PC / Console',
      year: $('fYear').value.trim() || '2024',
      rating: $('fRating').value.trim() || '10',
      genres: $('fGenres').value.split(',').map(s=>s.trim()).filter(Boolean),
      images: [finalImage],
      favorite: $('fFavorite').checked,
      review: $('fReview').value.trim() || 'توضیحات و داستان بازی ثبت نشده است.'
    };
    if(editingId){ games = games.map(g => g.id===editingId ? newGame : g); }
    else { games.unshift(newGame); }
    closeOverlay('formOverlay');
    renderShelf(); renderPopular();
    showToast('بازی با موفقیت ذخیره شد 💾');
    await saveGamesToStorage();
  });

  window.deleteGame = async function(id){
    if(!confirm('آیا از حذف این بازی اطمینان دارید؟')) return;
    games = games.filter(g=>g.id!==id);
    closeOverlay('detailOverlay');
    renderShelf(); renderPopular();
    showToast('بازی حذف شد 🗑️');
    await saveGamesToStorage();
  };

  window.filterGames = function(){ currentPage = 1; renderShelf(); };

  function getSelectedPlatforms(){
    const boxes = document.querySelectorAll('#platformCheckboxes input:checked');
    return Array.from(boxes).map(cb=>cb.value);
  }

  function getFilteredList(){
    let list = games.slice();
    const search = $('searchInput').value.trim().toLowerCase();
    if(search){ list = list.filter(g => (g.title||'').toLowerCase().includes(search)); }
    const selectedPlatforms = getSelectedPlatforms();
    if(selectedPlatforms.length > 0){
      list = list.filter(g => selectedPlatforms.some(p => (g.platform||'').toLowerCase().includes(p.toLowerCase())));
    }
    if(genreFilter){
      list = list.filter(g => (g.genres||[]).some(x => x.toLowerCase() === genreFilter.toLowerCase()));
    }
    if(wishOnly){
      const wish = JSON.parse(localStorage.getItem('wishlist') || '[]');
      list = list.filter(g => wish.includes(g.id));
    }
    return list;
  }

  window.filterGenre = function(g){
    genreFilter = g;
    currentPage = 1;
    renderShelf();
    if(g) $('shelf').scrollIntoView({behavior:'smooth', block:'start'});
  };

  function renderShelf(){
    const shelf = $('shelf');
    shelf.innerHTML = '';
    const list = getFilteredList();

    if(list.length === 0){
      shelf.innerHTML = `<div class="empty-note">${games.length===0 ? 'قفسه هنوز خالیه.' : 'چیزی با این فیلترها پیدا نشد.'}</div>`;
      renderPagination(0);
      return;
    }

    const start = (currentPage-1) * GAMES_PER_PAGE;
    const paginated = list.slice(start, start+GAMES_PER_PAGE);

    paginated.forEach(g=>{
      const card = document.createElement('div');
      card.className = 'game-card-modern';
      const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);
      const deleteBtnHtml = isAdmin ? `<button class="admin-delete-btn" onclick="event.stopPropagation(); deleteGame('${g.id}')">✕</button>` : '';
      card.innerHTML = `
        ${deleteBtnHtml}
        <img class="card-poster" src="${poster}" alt="${escapeHtml(g.title)}" loading="lazy">
        <div class="card-info">
          <div class="card-title-text" dir="ltr">${escapeHtml(g.title)}</div>
          <div class="card-genres">${(g.genres||[]).slice(0,2).join(' • ')}</div>
          <div class="card-footer-row">
            <span class="platform-badge">🖥️ ${escapeHtml(g.platform || 'پلتفرم')}</span>
          </div>
        </div>
      `;
      card.onclick = ()=>openDetail(g.id);
      shelf.appendChild(card);
    });

    renderPagination(list.length);
  }

  function renderPopular(){
    const popShelf = $('popularShelf');
    popShelf.innerHTML = '';
    const popular = games.filter(g=>g.favorite).slice(0,4);
    if(popular.length===0){
      popShelf.innerHTML = `<div class="empty-note">هنوز بازی محبوبی علامت نخورده.</div>`;
      return;
    }
    popular.forEach(g=>{
      const card = document.createElement('div');
      card.className = 'game-card-modern';
      const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);
      card.innerHTML = `
        <img class="card-poster" src="${poster}" alt="${escapeHtml(g.title)}" loading="lazy">
        <div class="card-info">
          <div class="card-title-text" dir="ltr">${escapeHtml(g.title)}</div>
          <div class="card-footer-row" style="margin-top:8px;"><span>❤️ محبوب</span></div>
        </div>
      `;
      card.onclick = ()=>openDetail(g.id);
      popShelf.appendChild(card);
    });
  }

  function renderPagination(total){
    const pages = Math.ceil(total / GAMES_PER_PAGE);
    const box = $('paginationBox');
    box.innerHTML = '';
    if(pages <= 1) return;
    for(let i=1;i<=pages;i++){
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i===currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = ()=>{ currentPage=i; renderShelf(); window.scrollTo({top:0,behavior:'smooth'}); };
      box.appendChild(btn);
    }
  }

  window.resetAllFilters = function(){
    document.querySelectorAll('#platformCheckboxes input').forEach(cb=>cb.checked=false);
    $('searchInput').value = '';
    genreFilter = null;
    wishOnly = false;
    $('btnWishlistRail').classList.remove('active');
    currentPage = 1;
    renderShelf();
    showToast('فیلترها بازنشانی شدند');
  };

  window.toggleFilterDrawer = function(){ $('filterDrawer').classList.toggle('hidden'); };
  window.toggleWishlistOnly = function(){
    wishOnly = !wishOnly;
    $('btnWishlistRail').classList.toggle('active', wishOnly);
    renderShelf();
  };

  window.openDetail = function(id){
    const g = games.find(x=>x.id===id);
    if(!g) return;
    const body = $('detailBody');
    const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);
    const adminActionsHtml = isAdmin ? `
      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
        <button onclick="openForm('${g.id}')" style="background:var(--primary); color:white; padding:8px 16px; border-radius:8px; font-weight:bold;">ویرایش ✏️</button>
        <button onclick="deleteGame('${g.id}')" style="background:var(--red-danger); color:white; padding:8px 16px; border-radius:8px; font-weight:bold;">حذف 🗑️</button>
      </div>` : '';
    const genresHtml = (g.genres||[]).map(x=>`<span style="background:var(--border); padding:4px 10px; border-radius:12px; font-size:11px;">${escapeHtml(x)}</span>`).join('');
    body.innerHTML = `
      <div style="display:flex; gap:16px; flex-direction:column; align-items:center;">
        <img src="${poster}" style="width:180px; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,0.5);">
        <div style="text-align:center; width:100%;">
          <h2 style="font-size:24px; font-weight:900; color:var(--primary); margin-bottom:8px;" dir="ltr">${escapeHtml(g.title)}</h2>
          <div style="display:flex; gap:5px; justify-content:center; flex-wrap:wrap; margin:10px 0;">${genresHtml}</div>
          <p style="color:var(--text-muted); margin:8px 0; font-size:13px;">پلتفرم: ${escapeHtml(g.platform || 'نامشخص')}</p>
          <p style="color:var(--text-muted); font-size:13px;">سال انتشار: ${escapeHtml(String(g.year || 'نامشخص'))}</p>
          <div style="margin-top:15px; font-size:18px; font-weight:bold;">امتیاز سایت: <span style="color:var(--pink-neon);">${escapeHtml(String(g.rating || '۱۰'))}</span>/۱۰</div>
          <div style="margin-top:20px; text-align:justify; background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; border:1px solid var(--border);">
            <strong style="color:var(--pink-neon); font-size:14px;">داستان و معرفی بازی:</strong><br>
            <p style="margin-top:8px; line-height:1.8; font-size:13px;">${escapeHtml(g.review || 'هنوز داستانی برای این بازی ثبت نشده است.')}</p>
          </div>
          ${adminActionsHtml}
        </div>
      </div>
    `;
    $('detailOverlay').classList.remove('hidden');
  };

  window.closeOverlay = function(id){ $(id).classList.add('hidden'); };

  let logoClickCount = 0, logoClickTimer = null;
  $('siteTitle').addEventListener('click', function(){
    logoClickCount++;
    clearTimeout(logoClickTimer);
    logoClickTimer = setTimeout(()=>{ logoClickCount = 0; }, 1500);
    if(logoClickCount >= 2){
      logoClickCount = 0;
      if(isAdmin){
        isAdmin = false;
        $('btnAddGame').classList.add('hidden');
        showToast('از حالت مدیر خارج شدی.');
        renderShelf();
        return;
      }
      const pass = prompt('رمز مدیر را وارد کنید:');
      if(pass === null) return;
      if(pass === ADMIN_PASSWORD){
        isAdmin = true;
        $('btnAddGame').classList.remove('hidden');
        showToast('حالت مدیریت فعال شد 👑');
        renderShelf();
      } else {
        showToast('رمز اشتباهه.');
      }
    }
  });

  $('searchInput').addEventListener('input', ()=>{ currentPage = 1; renderShelf(); });

  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(()=>t.classList.add('hidden'), 2200);
  }

  $('themeToggleBtn').addEventListener('click', ()=>{
    const light = document.body.classList.toggle('light');
    $('themeToggleBtn').textContent = light ? '☀️' : '🌙';
    try{ localStorage.setItem('theme', light ? 'light' : 'dark'); }catch(e){}
  });
  try{
    if(localStorage.getItem('theme') === 'light'){
      document.body.classList.add('light');
      $('themeToggleBtn').textContent = '☀️';
    }
  }catch(e){}
})();
</script>
</body>
</html>
