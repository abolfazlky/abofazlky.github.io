<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0d12;
    --bg-card: #171923;
    --bg-card-hover: #212536;
    --bg-panel: #13151f;
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --pink-neon: #d946ef;
    --accent: #a855f7;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: #252a3e;
    --red-danger: #dc2626;
  }

  body.light {
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --bg-card-hover: #f8fafc;
    --bg-panel: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; outline: none; background: none; font-family: inherit; }
  input, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--pink-neon); outline-offset: 2px; }

  .app-container { display: flex; flex-direction: column; min-height: 100vh; }

  header.top-bar {
    height: 70px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .brand-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-logo .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--primary), var(--pink-neon));
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: white; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
  }
  .brand-logo h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; color: white; }
  body.light .brand-logo h1 { color: var(--text-main); }

  .header-left { display: flex; align-items: center; gap: 10px; }

  .search-box { position: relative; width: 220px; }
  .search-box input {
    width: 100%; padding: 8px 36px 8px 12px; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); font-size: 12px;
  }
  .search-box input:focus { border-color: var(--primary); }
  .search-box .search-icon {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 13px; pointer-events: none;
  }

  .main-wrapper { display: flex; flex: 1; position: relative; }

  .nav-rail {
    width: 70px; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 22px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; color: var(--text-muted); font-size: 20px; transition: all 0.2s;
  }
  .rail-btn:hover, .rail-btn.active { background: var(--primary); color: white; box-shadow: 0 0 12px rgba(124,58,237,0.4); }

  .content-area { flex: 1; padding: 28px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 20px; font-weight: 800; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .btn-add-game {
    background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
  }

  .active-filter-chip{
    display:inline-flex; align-items:center; gap:8px; background:var(--bg-card);
    border:1px solid var(--pink-neon); color:var(--text-main); font-size:12px;
    padding:6px 12px; border-radius:20px;
  }
  .active-filter-chip button{ color: var(--pink-neon); font-weight:900; }

  .games-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px; margin-bottom: 35px;
  }
  .empty-note{ grid-column:1/-1; text-align:center; padding:50px 20px; color: var(--text-muted); font-size:14px; }

  .game-card-modern {
    position: relative;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    cursor: pointer; display: flex; flex-direction: column;
  }
  .game-card-modern:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .card-poster { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #111; display:block; }
  .card-poster-placeholder{
    width:100%; aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
    font-size:30px; color: rgba(255,255,255,0.85);
  }
  .card-info { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-title-text { font-size: 14px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-footer-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); gap:6px; }
  .card-footer-row .platform-badge{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px; }
  .admin-del-btn{
    position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,0.65); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .rating-badge{
    position:absolute; top:8px; right:8px; background: var(--accent); color:#fff; font-size:11px;
    font-weight:800; padding:3px 8px; border-radius:10px; z-index:2;
  }

  .promo-banner {
    background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%);
    border: 2px solid var(--pink-neon); border-radius: 20px; padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between; margin: 35px 0;
    box-shadow: 0 0 25px rgba(217, 70, 239, 0.25); flex-wrap: wrap; gap: 16px;
  }
  .banner-content h3 { font-size: 22px; font-weight: 900; color: white; margin-bottom: 6px; }
  .banner-content p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
  .banner-btn { background: var(--primary); color: white; padding: 10px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; }

  .filter-panel {
    width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border);
    padding: 24px 18px; display: flex; flex-direction: column; gap: 24px; z-index: 30;
  }
  .panel-header { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 800; }
  .section-links { display: flex; flex-direction: column; gap: 10px; }
  .link-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 10px; font-size: 13px; color: var(--text-muted); }
  .link-item:hover { background: var(--bg-card-hover); color: var(--text-main); }

  .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
  .checkbox-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.02); border-radius: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .checkbox-item input { accent-color: var(--primary); }

  .btn-reset-filters { background: var(--red-danger); color: white; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
  .page-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
  .hidden { display: none !important; }
  .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
  .modal-close { position: absolute; top: 14px; left: 14px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); color: white; display: flex; align-items: center; justify-content: center; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-main); font-size: 13px;
  }
  .field textarea{ min-height:90px; resize:vertical; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

  .genre-tags{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .genre-tag{ background: rgba(168,85,247,0.15); color: var(--accent); border:1px solid rgba(168,85,247,0.4); padding:3px 10px; border-radius:14px; font-size:11px; }
  .admin-actions{ display:flex; gap:10px; margin-top:16px; }
  .admin-actions button{ flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; }
  .btn-edit{ background: var(--bg-main); color: var(--text-main); border:1px solid var(--border); }
  .btn-delete{ background: var(--red-danger); color:#fff; }

  @media (max-width: 768px) {
    header.top-bar { padding: 0 12px; height: 60px; }
    .brand-logo h1 { font-size: 16px; }
    .brand-logo .logo-icon { width: 32px; height: 32px; font-size: 16px; }
    .search-box { width: 110px; }
    .search-box input { padding: 6px 26px 6px 8px; font-size: 11px; }
    .nav-rail { display: none; }
    .filter-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 80%; max-width: 280px; box-shadow: -5px 0 30px rgba(0,0,0,0.8); overflow-y:auto; }
    .content-area { padding: 16px 12px; }
    .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card-info { padding: 8px; gap: 4px; }
    .card-title-text { font-size: 12px; }
    .promo-banner { flex-direction: column; text-align: center; padding: 18px 14px; gap: 12px; }
  }
</style>
</head>

(function(){
  const ADMIN_PASSWORD = "arcade";
  const FIREBASE_URL = 'https://moarefi-bazi-default-rtdb.firebaseio.com';
  const PLACEHOLDER_COLORS = ['#7c3aed','#d946ef','#0891b2','#059669','#ca8a04','#dc2626'];

  let games = [];
  let isAdmin = false;
  let editingId = null;
  let pendingImageData = '';
  let currentPage = 1;

  async function fbGet(key){
    try{
      const res = await fetch(`${FIREBASE_URL}/${key}.json`);
      if(!res.ok) return null;
      const data = await res.json();
      return (data===null||data===undefined) ? null : { value: data };
    }catch(e){ return null; }
  }
  async function fbSet(key, value){
    try{
      const res = await fetch(`${FIREBASE_URL}/${key}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value)
      });
      if(!res.ok) return null;
      return { value };
    }catch(e){ return null; }
  }

  function placeholderColor(title){
    let h=0; for(let i=0;i<title.length;i++){ h=(h*31+title.charCodeAt(i))>>>0; }
    return PLACEHOLDER_COLORS[h % PLACEHOLDER_COLORS.length];
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  const SAMPLE_GAMES = [
    { id:'1', title:'الدن رینگ', platform:'PC / PS5 / Xbox', year:'2022', rating:'10', genres:['اکشن','نقش‌آفرینی'], images:[], favorite:true, review:'یک جهان‌باز واقعی و پر چالش با طراحی مرحله‌های فوق‌العاده.' },
    { id:'2', title:'خدای جنگ', platform:'PS4 / PS5 / PC', year:'2018', rating:'9.5', genres:['اکشن','ماجراجویی'], images:[], favorite:true, review:'سفری حماسی و پر از احساس در دل اساطیر نورس.' },
    { id:'3', title:'فورزا هورایزن 5', platform:'Xbox Series X|S / PC', year:'2021', rating:'9', genres:['مسابقه‌ای'], images:[], favorite:false, review:'یکی از بهترین بازی‌های ریسینگ این چند سال، با دنیای زیبای مکزیک.' },
    { id:'4', title:'زلدا: نفس وحشی', platform:'Nintendo Switch', year:'2017', rating:'10', genres:['ماجراجویی','دنیای‌باز'], images:[], favorite:true, review:'یه تعریف تازه از آزادی عمل تو بازی‌های دنیای‌باز.' },
    { id:'5', title:'آمونگ آس', platform:'Android / PC / Switch', year:'2018', rating:'8', genres:['چندنفره','پارتی'], images:[], favorite:false, review:'یه بازی گروهی ساده و اعتیادآور برای پیدا کردن خائن جمع.' },
    { id:'6', title:'رد دد ریدمپشن 2', platform:'PC / PS4 / Xbox', year:'2018', rating:'10', genres:['دنیای‌باز','ماجراجویی'], images:[], favorite:true, review:'شاهکار داستان‌سرایی و یکی از واقعی‌ترین دنیاهای باز ساخته‌شده.' },
    { id:'7', title:'هورایزن زیرو داون', platform:'PC / PS4', year:'2017', rating:'8.5', genres:['اکشن','نقش‌آفرینی'], images:[], favorite:false, review:'مبارزه با ماشین‌های عظیم در دنیایی پساآخرالزمانی جذاب.' },
    { id:'8', title:'ذا لست آف آس 2', platform:'PS4 / PS5', year:'2020', rating:'9', genres:['اکشن','ماجراجویی'], images:[], favorite:true, review:'روایتی تلخ، احساسی و تکنیکال از استودیو ناتی‌داگ.' },
    { id:'9', title:'اوورکوکد 2', platform:'PC / Switch / PS4', year:'2018', rating:'7.5', genres:['چندنفره','شبیه‌سازی','پارتی'], images:[], favorite:false, review:'آشپزی هیجانی و شلوغ که برای دورهمی دوستانه ساخته شده.' },
    { id:'10', title:'ماینکرفت', platform:'PC / Android / iOS', year:'2011', rating:'9.5', genres:['بقا','ساخت‌وساز'], images:[], favorite:true, review:'جهانی بی‌انتها برای ساخت‌وساز و خلاقیت بدون محدودیت.' },
    { id:'11', title:'فال گایز', platform:'PC / PS / Xbox / Switch', year:'2020', rating:'7', genres:['چندنفره','پارتی'], images:[], favorite:false, review:'یه بازی رنگارنگ و شلوغ عالی برای جمع‌های چندنفره.' },
    { id:'12', title:'ایت تیکز تو', platform:'PC / PS5 / Xbox', year:'2021', rating:'9', genres:['چندنفره','ماجراجویی'], images:[], favorite:true, review:'بهترین تجربه‌ی دونفره‌ی همکاری که تا حالا بازی کردم.' },
  ];

  async function loadGames(){
    try{
      const res = await fbGet('games');
      games = res ? migrate(JSON.parse(res.value)) : [];
    }catch(e){ games = []; }
    if(games.length === 0){
      try{
        const seededRes = await fbGet('seeded_modern');
        if(!seededRes){
          games = migrate(SAMPLE_GAMES.slice());
          await saveGames();
          await fbSet('seeded_modern', 'true');
        }
      }catch(e){}
    }
    renderShelf();
    renderPopular();
  }

  function migrate(list){
    return (list||[]).map(g=>{
      if(!g.images) g.images = [];
      if(!g.genres) g.genres = [];
      if(g.favorite===undefined) g.favorite = false;
      return g;
    });
  }

  async function saveGames(){
    const res = await fbSet('games', JSON.stringify(games));
    if(!res){ showToast('ذخیره‌سازی انجام نشد؛ دوباره امتحان کن.'); return false; }
    return true;
  }

  window.filterGames = function(){ currentPage = 1; renderShelf(); };

  function getSelectedPlatforms(){
    const boxes = document.querySelectorAll('#platformCheckboxes input:checked');
    return Array.from(boxes).map(cb=>cb.value);
  }

  function getFilteredList(){
    let list = games.slice();
    const search = $('searchInput').value.trim().toLowerCase();
    if(search){ list = list.filter(g => (g.title||'').toLowerCase().includes(search)); }
    const selectedPlatforms = getSelectedPlatforms();
    if(selectedPlatforms.length > 0){
      list = list.filter(g => selectedPlatforms.some(p => (g.platform||'').toLowerCase().includes(p.toLowerCase())));
    }
    if(genreFilter){
      list = list.filter(g => (g.genres||[]).includes(genreFilter));
    }
    return list;
  }

  function renderActiveFilterChip(){
    const box = $('activeFilterBox');
    if(genreFilter){
      box.innerHTML = `<span class="active-filter-chip">ژانر: ${escapeHtml(genreFilter)} <button onclick="clearGenreFilter()">✕</button></span>`;
    } else {
      box.innerHTML = '';
    }
  }

  window.clearGenreFilter = function(){
    genreFilter = null;
    currentPage = 1;
    renderShelf();
  };

  window.filterGenre = function(g){
    genreFilter = g;
    currentPage = 1;
    renderShelf();
    document.getElementById('shelf').scrollIntoView({behavior:'smooth', block:'start'});
  };

  function cardMediaHtml(g){
    if(g.images && g.images[0]){
      return `<img class="card-poster" src="${g.images[0]}" alt="${escapeHtml(g.title)}" loading="lazy">`;
    }
    const color = placeholderColor(g.title||'game');
    return `<div class="card-poster-placeholder" style="background:${color};">🎮</div>`;
  }

  function renderShelf(){
    renderActiveFilterChip();
    const shelf = $('shelf');
    shelf.innerHTML = '';
    const list = getFilteredList();

    if(list.length === 0){
      shelf.innerHTML = `<div class="empty-note">${games.length===0 ? 'قفسه هنوز خالیه.' : 'چیزی با این فیلترها پیدا نشد.'}</div>`;
      renderPagination(0);
      return;
    }

    const start = (currentPage-1) * GAMES_PER_PAGE;
    const paginated = list.slice(start, start+GAMES_PER_PAGE);

    paginated.forEach(g=>{
      const card = document.createElement('div');
      card.className = 'game-card-modern';
      card.innerHTML = `
        ${isAdmin ? `<button class="admin-del-btn" title="حذف">✕</button>` : ''}
        ${(g.rating!=null && g.rating!=='') ? `<div class="rating-badge">${escapeHtml(String(g.rating))}</div>` : ''}
        ${cardMediaHtml(g)}
        <div class="card-info">
          <div class="card-title-text">${escapeHtml(g.title)}</div>
          <div class="card-footer-row">
            <span class="platform-badge">🖥️ ${escapeHtml(g.platform || 'پلتفرم')}</span>
          </div>
        </div>
      `;
      card.onclick = (ev)=>{
        if(ev.target.classList.contains('admin-del-btn')){ ev.stopPropagation(); deleteGame(g.id); return; }
        openDetail(g.id);
      };
      shelf.appendChild(card);
    });

    renderPagination(list.length);
  }

  function renderPopular(){
    const popShelf = $('popularShelf');
    popShelf.innerHTML = '';
    const popular = games.filter(g=>g.favorite).slice(0,4);
    if(popular.length===0){
      popShelf.innerHTML = `<div class="empty-note">هنوز بازی محبوبی علامت نخورده.</div>`;
      return;
    }
    popular.forEach(g=>{
      const card = document.createElement('div');
      card.className = 'game-card-modern';
      card.innerHTML = `
        ${cardMediaHtml(g)}
        <div class="card-info">
          <div class="card-title-text">${escapeHtml(g.title)}</div>
          <div class="card-footer-row"><span>❤️ محبوب</span></div>
        </div>
      `;
      card.onclick = ()=>openDetail(g.id);
      popShelf.appendChild(card);
    });
  }

  function renderPagination(total){
    const pages = Math.ceil(total / GAMES_PER_PAGE);
    const box = $('paginationBox');
    box.innerHTML = '';
    if(pages <= 1) return;
    for(let i=1;i<=pages;i++){
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i===currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = ()=>{ currentPage=i; renderShelf(); window.scrollTo({top:0,behavior:'smooth'}); };
      box.appendChild(btn);
    }
  }

  window.resetAllFilters = function(){
    document.querySelectorAll('#platformCheckboxes input').forEach(cb=>cb.checked=false);
    $('searchInput').value = '';
    genreFilter = null;
    currentPage = 1;
    renderShelf();
    showToast('فیلترها پاک شدند');
  };

  window.toggleFilterDrawer = function(){ $('filterDrawer').classList.toggle('hidden'); };

  window.openDetail = function(id){
    const g = games.find(x=>x.id===id);
    if(!g) return;
    const body = $('detailBody');
    body.innerHTML = `
      <div style="display:flex; gap:16px; flex-direction:column; align-items:center;">
        <div style="width:160px; border-radius:12px; overflow:hidden; box-shadow:0 10px 20px rgba(0,0,0,0.5);">${cardMediaHtml(g)}</div>
        <div style="text-align:center; width:100%;">
          <h2 style="font-size:20px; font-weight:800; color:var(--primary);">${escapeHtml(g.title)}</h2>
          <p style="color:var(--text-muted); margin:6px 0; font-size:13px;">پلتفرم: ${escapeHtml(g.platform || 'نامشخص')}</p>
          <p style="color:var(--text-muted); font-size:13px;">سال انتشار: ${escapeHtml(String(g.year || 'نامشخص'))}</p>
          <div class="genre-tags" style="justify-content:center;">
            ${(g.genres||[]).map(x=>`<span class="genre-tag">${escapeHtml(x)}</span>`).join('')}
          </div>
          <div style="margin-top:10px; font-size:16px; font-weight:bold;">امتیاز: <span style="color:var(--pink-neon);">${g.rating!=null && g.rating!=='' ? escapeHtml(String(g.rating)) : '—'}</span>/۱۰</div>
          <p style="margin-top:12px; line-height:1.7; font-size:13px; text-align:justify;">${escapeHtml(g.review || 'معرفی ثبت نشده.')}</p>
          ${isAdmin ? `
          <div class="admin-actions">
            <button class="btn-edit" id="editBtn">✏️ ویرایش</button>
            <button class="btn-delete" id="delBtn">🗑️ حذف</button>
          </div>` : ''}
        </div>
      </div>
    `;
    if(isAdmin){
      $('editBtn').onclick = ()=>{ closeOverlay('detailOverlay'); openForm(g.id); };
      $('delBtn').onclick = ()=>{ closeOverlay('detailOverlay'); deleteGame(g.id); };
    }
    $('detailOverlay').classList.remove('hidden');
  };

  function deleteGame(id){
    if(!confirm('این بازی حذف بشه؟')) return;
    games = games.filter(g=>g.id!==id);
    renderShelf(); renderPopular();
    showToast('حذف شد.');
    saveGames();
  }

  window.openForm = function(id){
    editingId = id;
    const g = id ? games.find(x=>x.id===id) : null;
    $('formTitle').textContent = g ? 'ویرایش بازی' : 'افزودن بازی جدید';
    $('fTitle').value = g ? g.title : '';
    $('fPlatform').value = g ? (g.platform||'') : '';
    $('fGenres').value = g ? (g.genres||[]).join(', ') : '';
    $('fYear').value = g ? (g.year||'') : '';
    $('fRating').value = g ? (g.rating!=null?g.rating:'') : '';
    const existingImg = g && g.images && g.images[0] ? g.images[0] : '';
    $('fImgUrl').value = existingImg;
    pendingImageData = '';
    $('fImgFile').value = '';
    if(existingImg){
      $('fImgPreview').src = existingImg;
      $('fImgPreviewWrap').classList.remove('hidden');
    } else {
      $('fImgPreviewWrap').classList.add('hidden');
    }
    $('fFavorite').checked = g ? !!g.favorite : false;
    $('fReview').value = g ? (g.review||'') : '';
    $('formOverlay').classList.remove('hidden');
  };

  function resizeImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 700;
          const scale = Math.min(1, maxW/img.width);
          const w = img.width*scale, h = img.height*scale;
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  $('fImgFile').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImage(file);
      pendingImageData = dataUrl;
      $('fImgUrl').value = '';
      $('fImgPreview').src = dataUrl;
      $('fImgPreviewWrap').classList.remove('hidden');
    }catch(e){
      showToast('نتونستم عکس رو بخونم.');
    }
  });

  $('bulkImgFiles').addEventListener('change', async (ev)=>{
    const files = Array.from(ev.target.files || []);
    if(!files.length) return;
    showToast(`در حال افزودن ${files.length} بازی...`);
    let addedCount = 0;
    for(const file of files){
      try{
        const dataUrl = await resizeImage(file);
        const nameGuess = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
        games.push({
          id: 'g_' + Date.now() + '_' + addedCount,
          title: nameGuess || 'بازی بدون‌نام',
          platform: '',
          year: '',
          rating: '',
          genres: [],
          images: [dataUrl],
          favorite: false,
          review: ''
        });
        addedCount++;
      }catch(e){ /* skip file that failed to read */ }
    }
    ev.target.value = '';
    renderShelf(); renderPopular();
    showToast(`${addedCount} بازی با عکس اضافه شد — حالا رو هرکدوم بزن و اسم/توضیحشو کامل کن.`);
    saveGames();
  });

  $('fImgClearBtn').addEventListener('click', ()=>{
    pendingImageData = '';
    $('fImgUrl').value = '';
    $('fImgFile').value = '';
    $('fImgPreviewWrap').classList.add('hidden');
  });

  $('fImgUrl').addEventListener('input', ()=>{
    const val = $('fImgUrl').value.trim();
    if(val){
      pendingImageData = '';
      $('fImgPreview').src = val;
      $('fImgPreviewWrap').classList.remove('hidden');
    }
  });

  $('saveFormBtn').addEventListener('click', ()=>{
    const title = $('fTitle').value.trim();
    if(!title){ showToast('عنوان رو وارد کن.'); return; }
    const finalImg = pendingImageData || $('fImgUrl').value.trim();
    const genres = $('fGenres').value.split(',').map(s=>s.trim()).filter(Boolean);
    const payload = {
      id: editingId || ('g_' + Date.now()),
      title,
      platform: $('fPlatform').value.trim(),
      year: $('fYear').value.trim(),
      rating: $('fRating').value.trim(),
      genres,
      images: finalImg ? [finalImg] : [],
      favorite: $('fFavorite').checked,
      review: $('fReview').value.trim()
    };
    if(editingId){
      games = games.map(g => g.id===editingId ? payload : g);
    } else {
      games.push(payload);
    }
    // ذخیره‌ی سریع: اول ظاهر سایت آپدیت می‌شه، بعد پشت‌صحنه رو دیتابیس نوشته می‌شه
    closeOverlay('formOverlay');
    renderShelf(); renderPopular();
    showToast('ذخیره شد.');
    saveGames();
  });

  window.closeOverlay = function(id){ $(id).classList.add('hidden'); };

  let logoClickCount = 0, logoClickTimer = null;
  $('siteTitle').addEventListener('click', function(){
    logoClickCount++;
    clearTimeout(logoClickTimer);
    logoClickTimer = setTimeout(()=>{ logoClickCount = 0; }, 1500);
    if(logoClickCount >= 3){
      logoClickCount = 0;
      if(isAdmin){
        isAdmin = false;
        $('btnAddGame').classList.add('hidden');
        $('btnBulkAdd').classList.add('hidden');
        showToast('از حالت مدیر خارج شدی.');
        renderShelf();
        return;
      }
      const pass = prompt('رمز مدیر رو وارد کن:');
      if(pass === null) return;
      if(pass === ADMIN_PASSWORD){
        isAdmin = true;
        $('btnAddGame').classList.remove('hidden');
        $('btnBulkAdd').classList.remove('hidden');
        showToast('حالت مدیر فعال شد.');
        renderShelf();
      } else {
        showToast('رمز اشتباهه.');
      }
    }
  });

  $('searchInput').addEventListener('input', ()=>{ currentPage = 1; renderShelf(); });

  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(()=>t.classList.add('hidden'), 2200);
  }

  $('themeToggleBtn').addEventListener('click', ()=>{
    const light = document.body.classList.toggle('light');
    $('themeToggleBtn').textContent = light ? '☀️' : '🌙';
    try{ localStorage.setItem('theme', light ? 'light' : 'dark'); }catch(e){}
  });
  try{
    if(localStorage.getItem('theme') === 'light'){
      document.body.classList.add('light');
      $('themeToggleBtn').textContent = '☀️';
    }
  }catch(e){}

  loadGames();
})();
</script>
</body>
</html>
