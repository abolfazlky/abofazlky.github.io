<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>معرفی بازی — مرجع و کاتالوگ جامع بازی‌های ویدیویی و موبایل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0d12; --bg-card: #171923; --bg-card-hover: #212536;
    --bg-panel: #13151f; --primary: #7c3aed; --pink-neon: #d946ef;
    --emerald-green: #10b981; --emerald-hover: #059669;
    --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #252a3e;
    --red-danger: #dc2626; --gold: #fbbf24;
  }

  body.theme-rdr2 {
    --bg-main: #120c09; --bg-card: #1c130e; --bg-card-hover: #291a13;
    --bg-panel: #18100b; --primary: #c2410c; --pink-neon: #f59e0b;
    --border: #431407; --text-main: #fef3c7; --text-muted: #d97706;
  }

  body.theme-cyberpunk {
    --bg-main: #05050a; --bg-card: #0d0d1a; --bg-card-hover: #16162e;
    --bg-panel: #0a0a14; --primary: #06b6d4; --pink-neon: #f43f5e;
    --border: #1e1b4b; --text-main: #ecfeff; --text-muted: #22d3ee;
  }

  body.light {
    --bg-main: #f1f5f9; --bg-card: #ffffff; --bg-card-hover: #f8fafc;
    --bg-panel: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; --border: #cbd5e1;
  }

  html, body { width: 100%; max-width: 100%; overflow-x: hidden !important; position: relative; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; }
  body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; outline: none; background: none; font-family: inherit; }

  header.top-bar {
    height: 70px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 40;
  }
  .brand-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-logo .logo-icon {
    width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--pink-neon));
    border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;
  }
  .brand-logo h1 { font-size: 20px; font-weight: 900; color: white; }

  .header-left { display: flex; align-items: center; gap: 8px; }
  .search-box { position: relative; width: 160px; }
  .search-box input {
    width: 100%; padding: 8px 36px 8px 12px; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: 20px; color: var(--text-main); font-size: 11px;
  }
  .search-box input:focus { border-color: var(--primary); outline: none; }
  .search-box .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; }

  .main-wrapper { display: flex; flex: 1; position: relative; width: 100%; }
  .nav-rail {
    width: 70px; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 18px;
  }
  .rail-btn {
    width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 18px; transition: all 0.2s;
  }
  .rail-btn:hover, .rail-btn.active { background: var(--primary); color: white; }

  .content-area { flex: 1; padding: 24px 20px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 18px; font-weight: 800; }
  .section-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .btn-add-game {
    background: var(--primary); color: white; padding: 8px 14px; border-radius: 12px;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;
  }

  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 30px; width: 100%; }
  .game-card-modern {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    transition: transform 0.2s, border-color 0.2s; cursor: pointer; display: flex; flex-direction: column; position: relative;
  }
  .game-card-modern:hover { transform: translateY(-5px); border-color: var(--primary); }
  .card-poster { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #171923; display: block; }
  .card-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .card-title-text { font-size: 14px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; direction: ltr; }
  .card-genres { font-size: 10px; color: var(--primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-footer-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-top: 4px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05); }

  .admin-delete-btn {
    position: absolute; top: 8px; right: 8px; background: var(--red-danger); color: white;
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; z-index: 10;
  }

  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 20px 0; width: 100%; }
  .page-btn { width: 34px; height: 34px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Modals */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
  .hidden { display: none !important; }
  .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; }
  .modal-close { position: absolute; top: 12px; left: 12px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 20; }
  
  .btn-modal-back {
    width: 100%; padding: 12px; margin-top: 20px; background: var(--bg-card-hover); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text-main); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .btn-modal-back:hover { background: var(--primary); color: white; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 12px; }
  
  /* گالری تصاویر */
  .form-gallery, .detail-gallery { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .form-gallery img, .detail-gallery img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
  .detail-gallery img:hover, .detail-gallery img.active { border-color: var(--pink-neon); transform: scale(1.1); }
  .form-gallery div { position: relative; }
  .form-gallery button { position: absolute; top: -5px; right: -5px; background: var(--red-danger); color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: 700; z-index: 200; }
  .btn-download-iran { background: linear-gradient(135deg, var(--emerald-green), var(--emerald-hover)); color: white; padding: 12px 16px; border-radius: 10px; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 12px; }

  .mobile-nav { display: none; }
  @media (max-width: 768px) {
    header.top-bar { padding: 0 10px; height: 60px; }
    .brand-logo h1 { font-size: 15px; }
    .search-box { width: 110px; }
    .search-box input { padding: 6px 24px 6px 6px; font-size: 10px; }
    .nav-rail { display: none; }
    .content-area { padding: 16px 10px; width: 100%; }
    .games-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; width: 100% !important; }
    
    .mobile-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
      background: var(--bg-panel); border-top: 1px solid var(--border); height: 55px; justify-content: space-around; align-items: center; z-index: 50;
    }
    .mobile-nav button { font-size: 16px; display: flex; flex-direction: column; align-items: center; color: var(--text-muted); }
    .mobile-nav button span { font-size: 9px; margin-top: 2px; }
    .mobile-nav button.active { color: var(--pink-neon); }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="top-bar">
    <div class="brand-logo" id="siteTitle" title="دوبار کلیک برای ورود/خروج مدیر">
      <div class="logo-icon">🎮</div>
      <h1>معرفی بازی</h1>
    </div>
    <div class="header-left">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="جستجو...">
      </div>
      <button class="rail-btn" id="userAccountBtn" onclick="handleAuthClick()" title="حساب کاربری" style="width:34px; height:34px; font-size:14px;">👤</button>
      <a href="https://t.me/Abolfazlkya" target="_blank" class="rail-btn" title="تلگرام" style="width:34px; height:34px; font-size:14px;">✈️</a>
      <button class="rail-btn" onclick="cycleTheme()" title="تغییر تم سایت" style="width:34px; height:34px; font-size:14px;">🎨</button>
    </div>
  </header>

  <div class="main-wrapper">
    <!-- Main Content -->
    <main class="content-area">
      <!-- ۱۰ بازی برتر ماه -->
      <div class="section-header">
        <div>
          <div class="section-title" style="color:var(--gold);">👑 ۱۰ بازی برتر ماه</div>
          <div class="section-subtitle">شاهکارهای با بالاترین امتیاز کاربران</div>
        </div>
      </div>
      <div class="games-grid" id="top10Shelf" style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));"></div>

      <!-- شبکه اصلی بازی‌ها -->
      <div class="section-header" style="margin-top:25px;">
        <div>
          <div class="section-title" id="mainSectionTitle">همه بازی‌های PC و کنسول</div>
          <div class="section-subtitle" id="mainSectionSubtitle">جدیدترین و محبوب‌ترین بازی‌های کامپیوتر و کنسول</div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-add-game hidden" id="btnAdminBackup" onclick="exportBackupJSON()" style="background:var(--bg-card); border:1px solid var(--border);">📥 بکاپ</button>
          <button class="btn-add-game hidden" id="btnAddGame" onclick="openForm(null)"><span>+</span> افزودن بازی</button>
        </div>
      </div>

      <div class="games-grid" id="shelf"></div>
      <div class="pagination-container" id="paginationBox"></div>
    </main>

    <!-- Icon Rail (دسکتاپ) -->
    <nav class="nav-rail">
      <button class="rail-btn active" onclick="resetAllFilters()" title="خانه">🏠</button>
      <button class="rail-btn" onclick="toggleMobileMode()" title="بازی‌های موبایل">📱</button>
      <button class="rail-btn" onclick="openGameFinder()" title="چی بازی کنم؟">🎲</button>
    </nav>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-nav">
    <button onclick="resetAllFilters()">🏠<span>خانه</span></button>
    <button onclick="toggleMobileMode()" id="mobNavPhone">📱<span>موبایل</span></button>
    <button onclick="openGameFinder()">🎲<span>پیشنهاد</span></button>
    <button onclick="cycleTheme()">🎨<span>تم</span></button>
  </nav>
</div>

<!-- Modal Finder -->
<div id="finderOverlay" class="overlay hidden" onclick="if(event.target===this) closeOverlay('finderOverlay')">
  <div class="modal-card" style="max-width:440px; text-align:center;">
    <button class="modal-close" onclick="closeOverlay('finderOverlay')">✕</button>
    <div style="font-size:40px; margin-bottom:8px;">🔮</div>
    <h2 style="font-size:20px; font-weight:900; color:var(--pink-neon); margin-bottom:6px;">امروز چی بازی کنم؟</h2>
    <p style="font-size:11px; color:var(--text-muted); margin-bottom:16px;">سبک مورد علاقه‌ت رو انتخاب کن تا یک بازی عالی پیشنهادی بهت معرفی بشه!</p>
    <div class="field">
      <select id="finderGenreSelect">
        <option value="ALL">همه سبک‌ها (تصادفی)</option>
        <option value="اکشن">اکشن و پرهیجان</option>
        <option value="نقش‌آفرینی">نقش‌آفرینی و داستانی</option>
        <option value="دنیای‌باز">جهان‌باز (Open World)</option>
      </select>
    </div>
    <button onclick="spinGameFinder()" class="btn-download-iran" style="background:linear-gradient(135deg, var(--primary), var(--pink-neon));">پیشنهاد بده 🎲</button>
    <div id="finderResultBox" style="margin-top:15px;"></div>
  </div>
</div>

<!-- Add/Edit Game Modal -->
<div id="formOverlay" class="overlay hidden" onclick="if(event.target===this) closeOverlay('formOverlay')">
  <div class="modal-card" style="max-width:550px;">
    <button class="modal-close" onclick="closeOverlay('formOverlay')">✕</button>
    <h2 id="formTitle" style="margin-bottom:14px; font-size:18px;">افزودن/ویرایش بازی</h2>
    <div class="field"><label>عنوان بازی (انگلیسی)</label><input type="text" id="fTitle" dir="ltr" placeholder="Elden Ring"></div>
    <div style="display:flex; gap:8px;">
      <div class="field" style="flex:1;"><label>پلتفرم</label><input type="text" id="fPlatform" placeholder="PC / PS5 / Xbox" dir="ltr"></div>
      <div class="field" style="width:90px;"><label>سال</label><input type="number" id="fYear"></div>
      <div class="field" style="width:90px;"><label>امتیاز</label><input type="number" id="fRating" max="10"></div>
    </div>
    <div class="field"><label>ژانرها (با ویرگول جدا کنید)</label><input type="text" id="fGenres" placeholder="اکشن, نقش‌آفرینی" dir="ltr"></div>
    <div class="field"><label>لینک مستقیم دانلود (اختیاری)</label><input type="url" id="fDownloadUrl" dir="ltr" placeholder="https://..."></div>
    
    <!-- سیستم گالری آپلود -->
    <div class="field" style="background:var(--bg-main); padding:10px; border:1px dashed var(--primary); border-radius:10px;">
      <label style="color:var(--pink-neon); font-weight:bold;">📸 آپلود عکس از گالری (تا ۱۰ عکس)</label>
      <input type="file" id="fImageUpload" multiple accept="image/*" style="border:none; padding:5px;">
      <div class="form-gallery" id="fGalleryPreview"></div>
    </div>

    <div class="field"><label>داستان و معرفی بازی</label><textarea id="fReview" style="height:80px;"></textarea></div>
    <button id="saveFormBtn" onclick="saveGameFromForm()" style="width:100%; padding:10px; background:var(--primary); color:white; border-radius:10px; font-weight:800;">ذخیره اطلاعات بازی 💾</button>
  </div>
</div>

<!-- Details Modal -->
<div id="detailOverlay" class="overlay hidden" onclick="if(event.target===this) closeOverlay('detailOverlay')">
  <div class="modal-card" style="max-width:600px;">
    <button class="modal-close" onclick="closeOverlay('detailOverlay')">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  const ADMIN_PASSWORD = "arcade";
  const FIREBASE_URL = 'https://moarefi-bazi-default-rtdb.firebaseio.com';

  let games = [];
  let isAdmin = false;
  let currentPage = 1;
  const GAMES_PER_PAGE = 12;
  let mobileModeOnly = false;
  let editingId = null;
  let currentThemeIndex = 0;
  
  // آرایه نگهدارنده عکس‌های آپلود شده
  let tempUploadedImages = [];

  const $ = id => document.getElementById(id);

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function createNeonPoster(title, color1='#1e1b4b', color2='#7c3aed') {
    const cleanTitle = (title || 'Game').substring(0, 18).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${color1}"/><stop offset="100%" stop-color="${color2}"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><circle cx="150" cy="160" r="55" fill="#d946ef" opacity="0.15"/><text x="50%" y="165" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="48" font-family="sans-serif">🎮</text><text x="50%" y="270" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900" font-family="sans-serif">${cleanTitle}</text></svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function generateDefaultSysReq(title, year, platform) {
    if (platform && (platform.toLowerCase().includes('mobile') || platform.toLowerCase().includes('android'))) {
      return 'اندروید ۷.۰ به بالا | حداقل رم: 3GB';
    }
    return 'RAM: 8GB | GPU: GTX 1060 | Storage: 50GB';
  }

  const RAW_GAMES = [
    ["Elden Ring","PC / PS5",2022,10,["اکشن","دنیای‌باز"],"سرزمینی نفرین‌شده که باید با شکست نیمه‌خدایان، الدن لرد شوید."],
    ["God of War","PS4 / PC",2018,9.5,["اکشن","ماجراجویی"],"نبرد حماسی کریتوس با خدایان نورس."],
    ["PUBG Mobile","Android / iOS",2018,9,["موبایل","آنلاین"],"بهترین تجربه بتل رویال موبایلی."]
  ];

  function buildFullDatabase() {
    return RAW_GAMES.map((g, i) => ({
      id: 'g_' + i, title: g[0], platform: g[1], year: g[2], rating: g[3], genres: g[4], review: g[5],
      downloadUrl: `https://www.google.com/search?q=${encodeURIComponent('دانلود بازی ' + g[0])}`,
      sysMin: generateDefaultSysReq(g[0], g[2], g[1]),
      images: [createNeonPoster(g[0])], favorite: g[3] >= 9.5, 
      isMobile: g[1].toLowerCase().includes('android')
    }));
  }

  window.onload = function() {
    checkAdminPersistent();
    loadGamesFast();
  };

  function checkAdminPersistent() {
    if (localStorage.getItem('gl_is_admin') === 'true') {
      isAdmin = true;
      if ($('btnAddGame')) $('btnAddGame').classList.remove('hidden');
      if ($('btnAdminBackup')) $('btnAdminBackup').classList.remove('hidden');
    }
  }

  window.cycleTheme = function() {
    currentThemeIndex = (currentThemeIndex + 1) % 3;
    document.body.className = '';
    if (currentThemeIndex === 1) { document.body.classList.add('theme-rdr2'); showToast('تم RDR2 🤠'); } 
    else if (currentThemeIndex === 2) { document.body.classList.add('theme-cyberpunk'); showToast('تم Cyberpunk 🦾'); } 
    else { showToast('تم اصلی 🎮'); }
  };

  function loadGamesFast() {
    const local = localStorage.getItem('gl_games_v20');
    if (local) {
      try { games = JSON.parse(local); } catch(e) { games = buildFullDatabase(); }
    } else {
      games = buildFullDatabase();
      localStorage.setItem('gl_games_v20', JSON.stringify(games));
    }
    renderShelf();
    renderTop10();
    syncWithServerBackground();
  }

  async function syncWithServerBackground() {
    try {
      const res = await fetch(`${FIREBASE_URL}/games.json`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.length > 0) {
          games = data;
          localStorage.setItem('gl_games_v20', JSON.stringify(games));
          renderShelf(); renderTop10();
        }
      }
    } catch(e) {}
  }

  async function saveGamesToStorage() {
    localStorage.setItem('gl_games_v20', JSON.stringify(games));
    try {
      await fetch(`${FIREBASE_URL}/games.json`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(games)
      });
    } catch(e) {}
  }

  // --- سیستم پردازش و فشرده‌سازی عکس‌ها از گالری ---
  function resizeAndCompressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // محدود کردن اندازه برای جلوگیری از پر شدن حافظه (Max Width: 500px)
          const MAX_WIDTH = 500;
          let scale = 1;
          if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          // فشرده سازی با کیفیت 60%
          const base64Str = canvas.toDataURL('image/jpeg', 0.6);
          resolve(base64Str);
        };
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // گرفتن عکس‌ها از input فایل
  $('fImageUpload').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    
    // سقف ۱۰ عکس
    const remainingSlots = 10 - tempUploadedImages.length;
    const filesToProcess = files.slice(0, remainingSlots);
    
    if (files.length > remainingSlots) {
      showToast('حداکثر می‌توانید ۱۰ عکس انتخاب کنید.');
    }

    for (let file of filesToProcess) {
      try {
        const base64 = await resizeAndCompressImage(file);
        tempUploadedImages.push(base64);
      } catch (err) {
        console.error("خطا در پردازش تصویر");
      }
    }
    updateFormGalleryPreview();
  });

  function updateFormGalleryPreview() {
    const container = $('fGalleryPreview');
    container.innerHTML = '';
    tempUploadedImages.forEach((src, index) => {
      container.innerHTML += `
        <div>
          <img src="${src}">
          <button type="button" onclick="removeTempImage(${index})">✕</button>
        </div>
      `;
    });
  }

  window.removeTempImage = function(index) {
    tempUploadedImages.splice(index, 1);
    updateFormGalleryPreview();
  };
  // ------------------------------------------------

  window.toggleMobileMode = function() {
    mobileModeOnly = !mobileModeOnly;
    $('mainSectionTitle').textContent = mobileModeOnly ? '📱 بازی‌های موبایل' : 'همه بازی‌های PC و کنسول';
    currentPage = 1; renderShelf();
  };

  window.openForm = function(id) {
    editingId = id;
    tempUploadedImages = []; // ریست کردن گالری فرم
    $('fImageUpload').value = '';
    updateFormGalleryPreview();

    if (id) {
      const g = games.find(x => x.id === id);
      if (g) {
        $('formTitle').textContent = 'ویرایش بازی';
        $('fTitle').value = g.title || '';
        $('fPlatform').value = g.platform || '';
        $('fYear').value = g.year || '';
        $('fRating').value = g.rating || '';
        $('fGenres').value = (g.genres || []).join(', ');
        $('fDownloadUrl').value = g.downloadUrl || '';
        $('fReview').value = g.review || '';
        
        // اگر بازی عکس‌های قبلی داشت، لود کن تو ادیتور
        if (g.images && g.images.length > 0 && !g.images[0].startsWith('data:image/svg')) {
          tempUploadedImages = [...g.images];
          updateFormGalleryPreview();
        }
      }
    } else {
      $('formTitle').textContent = 'افزودن بازی جدید';
      $('fTitle').value = ''; $('fPlatform').value = ''; $('fYear').value = '';
      $('fRating').value = ''; $('fGenres').value = ''; $('fDownloadUrl').value = '';
      $('fReview').value = '';
    }
    $('formOverlay').classList.remove('hidden');
  };

  window.saveGameFromForm = async function() {
    const title = $('fTitle').value.trim();
    if (!title) return alert('لطفا عنوان بازی را وارد کنید.');

    // تصمیم‌گیری برای عکس‌ها (اگر عکسی آپلود نشده، پوستر نئونی بساز)
    let finalImages = [...tempUploadedImages];
    if (finalImages.length === 0) {
      finalImages = [createNeonPoster(title)];
    }

    const platVal = $('fPlatform').value.trim() || 'PC / Console';
    const newGame = {
      id: editingId || ('g_' + Date.now()),
      title: title,
      platform: platVal,
      year: $('fYear').value.trim() || '2024',
      rating: $('fRating').value.trim() || '10',
      genres: $('fGenres').value.split(',').map(s=>s.trim()).filter(Boolean),
      downloadUrl: $('fDownloadUrl').value.trim() || `https://www.google.com/search?q=${encodeURIComponent('دانلود بازی ' + title)}`,
      sysMin: generateDefaultSysReq(title, $('fYear').value, platVal),
      images: finalImages,
      review: $('fReview').value.trim() || 'توضیحات بازی ثبت نشده است.',
      isMobile: platVal.toLowerCase().includes('mobile') || platVal.toLowerCase().includes('android')
    };

    if (editingId) { games = games.map(g => g.id === editingId ? newGame : g); } 
    else { games.unshift(newGame); }

    await saveGamesToStorage();
    closeOverlay('formOverlay'); renderShelf(); renderTop10();
    showToast('اطلاعات ذخیره شد 💾');
  };

  window.deleteGame = async function(id) {
    if (!confirm('آیا از حذف این بازی اطمینان دارید؟')) return;
    games = games.filter(g => g.id !== id);
    await saveGamesToStorage();
    closeOverlay('detailOverlay'); renderShelf(); renderTop10();
  };

  function getFilteredList() {
    let list = mobileModeOnly ? games.filter(g => g.isMobile) : games.filter(g => !g.isMobile);
    const search = $('searchInput').value.trim().toLowerCase();
    if(search) list = list.filter(g => (g.title||'').toLowerCase().includes(search));
    return list;
  }

  function renderShelf() {
    const shelf = $('shelf'); shelf.innerHTML = '';
    const list = getFilteredList();
    const start = (currentPage - 1) * GAMES_PER_PAGE;
    const paginated = list.slice(start, start + GAMES_PER_PAGE);

    paginated.forEach(g => {
      const card = document.createElement('div'); card.className = 'game-card-modern';
      const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);
      card.innerHTML = `
        ${isAdmin ? `<button class="admin-delete-btn" onclick="event.stopPropagation(); deleteGame('${g.id}')">✕</button>` : ''}
        <img class="card-poster" src="${poster}">
        <div class="card-info">
          <div class="card-title-text" dir="ltr">${escapeHtml(g.title)}</div>
          <div class="card-footer-row">
            <span>🖥️ ${escapeHtml(g.platform)}</span>
          </div>
        </div>
      `;
      card.onclick = () => openDetail(g.id);
      shelf.appendChild(card);
    });
    renderPagination(list.length);
  }

  function renderTop10() {
    const box = $('top10Shelf'); if(!box) return; box.innerHTML = '';
    const topList = games.slice(0, 5);
    topList.forEach((g, index) => {
      const card = document.createElement('div'); card.className = 'game-card-modern';
      const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);
      card.innerHTML = `
        <div style="position:absolute; top:8px; left:8px; background:var(--gold); color:#000; font-weight:900; padding:2px 8px; border-radius:8px; font-size:11px; z-index:5;">#${index+1}</div>
        <img class="card-poster" src="${poster}">
        <div class="card-info"><div class="card-title-text" dir="ltr">${escapeHtml(g.title)}</div></div>
      `;
      card.onclick = () => openDetail(g.id);
      box.appendChild(card);
    });
  }

  function renderPagination(total) {
    const pages = Math.ceil(total / GAMES_PER_PAGE);
    const box = $('paginationBox'); box.innerHTML = '';
    for(let i=1; i<=pages; i++) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = () => { currentPage = i; renderShelf(); window.scrollTo({top:0, behavior:'smooth'}); };
      box.appendChild(btn);
    }
  }

  // تغییر عکس اصلی مودال موقع کلیک روی گالری
  window.changeMainPreview = function(src) {
    $('mainDetailPhoto').src = src;
    document.querySelectorAll('.detail-gallery img').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
  };

  window.openDetail = function(id) {
    const g = games.find(x => x.id === id);
    if(!g) return;
    const body = $('detailBody');
    const poster = (g.images && g.images[0]) ? g.images[0] : createNeonPoster(g.title);

    // ساخت گالری عکس‌ها (اگر بیشتر از ۱ عکس باشه)
    let galleryHtml = '';
    if (g.images && g.images.length > 1) {
      galleryHtml = '<div class="detail-gallery">' + g.images.map((src, idx) => `
        <img src="${src}" class="${idx===0?'active':''}" onclick="changeMainPreview('${src}')">
      `).join('') + '</div>';
    }

    // لینک هوشمند تریلر (جستجوی خودکار در آپارات)
    const autoTrailerLink = `https://www.aparat.com/search/${encodeURIComponent('تریلر بازی ' + g.title)}`;

    body.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center;">
        <img id="mainDetailPhoto" src="${poster}" style="width:200px; max-height:280px; object-fit:contain; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,0.5);">
        
        ${galleryHtml}

        <div style="text-align:center; width:100%; margin-top:20px;">
          <h2 style="font-size:24px; font-weight:900; color:var(--primary); margin-bottom:8px;" dir="ltr">${escapeHtml(g.title)}</h2>
          <p style="color:var(--text-muted); font-size:13px;">${escapeHtml(g.platform)} | سال: ${escapeHtml(g.year)}</p>
          
          <a href="${g.downloadUrl}" target="_blank" rel="noopener" class="btn-download-iran">
            📥 جستجو و دانلود بازی
          </a>

          <a href="${autoTrailerLink}" target="_blank" rel="noopener" style="display:inline-block; margin-top:15px; color:var(--pink-neon); font-size:13px; font-weight:bold; text-decoration:underline;">
            🎬 تماشای تریلر ویدیویی بازی (بدون فیلترشکن)
          </a>

          <div class="sys-req-box">
            <div class="sys-req-title">💻 حداقل سیستم مورد نیاز:</div>
            <p style="font-size:12px; color:var(--text-main); font-family:monospace; direction:ltr; text-align:left;">${escapeHtml(g.sysMin)}</p>
          </div>

          <div style="margin-top:20px; text-align:justify; background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; border:1px solid var(--border);">
            <strong style="color:var(--pink-neon); font-size:14px;">معرفی بازی:</strong><br>
            <p style="margin-top:8px; line-height:1.8; font-size:13px;">${escapeHtml(g.review)}</p>
          </div>
          
          ${isAdmin ? `<button onclick="openForm('${g.id}')" style="margin-top:15px; background:var(--primary); color:white; padding:8px 20px; border-radius:8px; font-weight:bold;">ویرایش ✏️</button>` : ''}
          
          <button class="btn-modal-back" onclick="closeOverlay('detailOverlay')">⬅️ بازگشت به لیست بازی‌ها</button>
        </div>
      </div>
    `;
    $('detailOverlay').classList.remove('hidden');
  };

  window.closeOverlay = id => $(id).classList.add('hidden');
  
  $('siteTitle').ondblclick = function() {
    if (isAdmin) {
      if (confirm('خروج از مدیریت؟')) { isAdmin = false; localStorage.removeItem('gl_is_admin'); location.reload(); }
    } else {
      if (prompt('رمز:') === ADMIN_PASSWORD) {
        isAdmin = true; localStorage.setItem('gl_is_admin', 'true');
        $('btnAddGame').classList.remove('hidden'); renderShelf(); showToast('مدیر وارد شد 👑');
      }
    }
  };

  $('searchInput').oninput = () => { currentPage = 1; renderShelf(); };
  function showToast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2000);
  }

})();
</script>
</body>
</html>
